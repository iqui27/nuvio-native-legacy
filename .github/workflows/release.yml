name: Release

# Builds every 2.x release file and puts them in a DRAFT release on this
# repository: nothing is public until someone presses Publish on GitHub.
#
#   Actions tab -> Release -> Run workflow -> version (must match
#   deploy/app/appinfo.json, e.g. 2.0.9)
#
# What comes from where (the same names tools/release.py checks, minus the
# Samsung .wgt, which is not built here):
#   Build TPK  NuvioTpk40/60/65 and NuvioTpk .tpk, libnuvio-<v>-tpk-arm.so and
#              libnuvio-<v>-tpk40-arm.so (the Samsung in-app update's download)
#   Build APK  Nuvio-<v>-android.apk and the two one-ABI lite APKs (signed only
#              when the NUVIO_ANDROID_KEYSTORE_B64 secret is set; without it the
#              draft has no APKs and the run says so)
#   Build IPK  space.nuvio.native.legacy_<v>_arm.ipk and _arm-highcache.ipk
#   here       repo.json and webosbrew.manifest.json (tools/hb-repo.sh, the
#              Homebrew Channel repository, still on iqui27/nuvio-native-legacy)
#              and SHA256SUMS of every file above.
# GitHub adds the source code archives itself when the release is published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (the one in deploy/app/appinfo.json)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version matches the app
        env:
          VER: ${{ inputs.version }}
        run: |
          app=$(python3 -c 'import json; print(json.load(open("deploy/app/appinfo.json"))["version"])')
          [ "$app" = "$VER" ] || { echo "::error::appinfo.json is $app, the run asked for $VER"; exit 1; }
          for f in tools/tizen-config.xml tools/tizen3-config.xml; do
            grep -q "version=\"$VER\"" "$f" || { echo "::error::$f is not at $VER"; exit 1; }
          done

  tpk:
    needs: check
    uses: ./.github/workflows/build-tpk.yml
    with:
      pacotes: "NuvioTpk40 NuvioTpk60 NuvioTpk65 NuvioTpk"
    secrets: inherit

  apk:
    needs: check
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit

  ipk:
    needs: check
    uses: ./.github/workflows/build-ipk.yml
    with:
      highcache: true
    secrets: inherit

  publish:
    needs: [tpk, apk, ipk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VER: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p dist
          need=(
            "space.nuvio.native.legacy_${VER}_arm.ipk"
            "space.nuvio.native.legacy_${VER}_arm-highcache.ipk"
            "Nuvio-${VER}-NuvioTpk40.tpk" "Nuvio-${VER}-NuvioTpk60.tpk"
            "Nuvio-${VER}-NuvioTpk65.tpk" "Nuvio-${VER}-NuvioTpk.tpk"
            "libnuvio-${VER}-tpk-arm.so" "libnuvio-${VER}-tpk40-arm.so"
          )
          apks=("Nuvio-${VER}-android.apk" "Nuvio-${VER}-android-lite-armv7.apk" "Nuvio-${VER}-android-lite-arm64.apk")
          take() { f=$(find artifacts -type f -name "$1" | head -1); [ -n "$f" ] && cp "$f" dist/; }
          for n in "${need[@]}"; do take "$n" || { echo "::error::missing $n"; exit 1; }; done
          nApk=0
          for n in "${apks[@]}"; do take "$n" && nApk=$((nApk + 1)) || true; done
          if [ "$nApk" -ne "${#apks[@]}" ]; then
            echo "::warning::signed APKs missing ($nApk of ${#apks[@]}): set NUVIO_ANDROID_KEYSTORE_B64 and the key secrets, then run again"
            rm -f dist/Nuvio-*-android*.apk
          fi

      # Homebrew Channel repository (repo.json, webosbrew.manifest.json) from the plain .ipk.
      - name: Homebrew Channel files
        run: bash tools/hb-repo.sh "dist/space.nuvio.native.legacy_${VER}_arm.ipk" dist

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum $(ls | grep -v '^SHA256SUMS$' | sort) > SHA256SUMS
          sha256sum -c SHA256SUMS
          { echo "### Nuvio $VER draft"; echo '```'; ls -la; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # A draft is created (or refilled, if a draft for this tag already
      # exists); a published release is never touched.
      - name: Draft release
        run: |
          set -euo pipefail
          tag="v$VER"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft > draft.txt 2>/dev/null; then
            [ "$(cat draft.txt)" = "true" ] || { echo "::error::$tag is already published"; exit 1; }
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" \
              --title "Nuvio $VER" --notes "Nuvio $VER" --repo "$GITHUB_REPOSITORY"
          fi
