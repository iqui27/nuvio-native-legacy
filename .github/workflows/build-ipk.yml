name: Build IPK

# Builds the LG webOS .ipk the way `bash tools/arm.sh --ipk --build` does on
# the owner's computer: the SDK image from tools/Dockerfile (openlgtv
# buildroot, aarch64 host, so an arm64 runner runs it natively), the static
# libass hybrid inside it, then the binary and the package. Also runs
# tools/verify-ass-arm.sh (checkasm + byte-for-byte renders, armv7 under
# qemu) on the image's libass. The .ipk is uploaded as one artifact.
#
# Runs by hand (Actions tab -> Build IPK -> Run workflow) and on pushes to the
# LG subtitle-engine branches. No P2P engine on CI (it lives on the owner's
# disk). A new push to the same branch cancels the build still running.

on:
  push:
    branches: [subtitle-rewrite-lg, claude/project-thread-96skg0]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: build-ipk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      NUVIO_P2P_MOTOR: none
      NUVIO_RELEASE_OUT: ${{ github.workspace }}/build/ipk
      RUSTUP_HOME: /home/runner/.rustup
      CARGO_HOME: /home/runner/.cargo
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The SDK image (toolchain, libass hybrid, FFmpeg for DTS) takes long to
      # build; its layers are cached, so a change to the libass patch rebuilds
      # from that layer on.
      - name: Build the webOS SDK image
        uses: docker/build-push-action@v6
        with:
          context: tools
          file: tools/Dockerfile
          platforms: linux/arm64
          tags: nuvio-webos-sdk
          load: true
          cache-from: type=gha,scope=webos-sdk
          cache-to: type=gha,scope=webos-sdk,mode=max

      # tools/arm.sh builds the Rust MKV core and the DV7 converter on the host
      # for armv7-unknown-linux-gnueabi (static libraries).
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0
          "$CARGO_HOME/bin/rustup" target add armv7-unknown-linux-gnueabi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Install ares-package and qemu
        run: |
          npm install --prefix "$RUNNER_TEMP/ares" @webos-tools/cli
          echo "NUVIO_ARES_PACKAGE=$RUNNER_TEMP/ares/node_modules/.bin/ares-package" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static

      # Server keys (Supabase login, Trakt, TMDB...): tools/env.sh reads them
      # from local.properties. The repository keeps the file's whole text in
      # the LOCAL_PROPERTIES secret (the name build-tpk.yml uses);
      # NUVIO_LOCAL_PROPERTIES is the name some Android/LG workflows used,
      # read only if the first is empty. Neither set: a test .ipk with login
      # and those services off, and a warning on the run.
      - name: Server keys
        env:
          PROPS: ${{ secrets.LOCAL_PROPERTIES || secrets.NUVIO_LOCAL_PROPERTIES }}
        run: |
          if [ -n "$PROPS" ]; then
            printf '%s\n' "$PROPS" > local.properties
            echo "local.properties from the secret ($(grep -c '=' local.properties) keys)"
            grep -q '^NUVIO_SUPABASE_URL=.' local.properties || echo "::warning::the secret has no NUVIO_SUPABASE_URL: login stays off"
          else
            echo "::warning::no LOCAL_PROPERTIES secret: the .ipk has no server keys (test build only)"
          fi

      - name: Verify libass on armv7
        run: bash tools/verify-ass-arm.sh 2>&1 | tee verify.log

      - name: Build the IPK
        run: |
          set -o pipefail
          bash tools/arm.sh --ipk --build 2>&1 | tee build.log

      - name: Show build error summary
        if: failure()
        run: |
          {
            echo '### Build failed - last 60 lines'
            echo '```'
            tail -n 60 build.log 2>/dev/null || tail -n 60 verify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioIpk
          path: build/ipk/*.ipk
          if-no-files-found: error
