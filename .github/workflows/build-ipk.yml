name: Build IPK

# Builds the LG webOS .ipk the way `bash tools/arm.sh --ipk --build` does on
# the owner's computer: the SDK image from tools/Dockerfile (openlgtv
# buildroot, aarch64 host, so an arm64 runner runs it natively), the static
# libass hybrid inside it, then the binary and the package. Also runs
# tools/verify-ass-arm.sh (checkasm + byte-for-byte renders, armv7 under
# qemu) on the image's libass. The .ipk is uploaded as one artifact.
#
# Runs by hand (Actions tab -> Build IPK -> Run workflow) and on pushes to the
# LG subtitle-engine branches. No P2P engine on CI (it lives on the owner's
# disk). A new push to the same branch cancels the build still running.

on:
  push:
    branches: [subtitle-rewrite-lg, claude/project-thread-96skg0]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  # release.yml: also the -highcache variant (texture cache fixed at 300 MB).
  workflow_call:
    inputs:
      highcache:
        type: boolean
        default: false

concurrency:
  group: build-ipk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      NUVIO_P2P_MOTOR: none
      NUVIO_RELEASE_OUT: ${{ github.workspace }}/build/ipk
      RUSTUP_HOME: /home/runner/.rustup
      CARGO_HOME: /home/runner/.cargo
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The SDK image (toolchain, libass hybrid, FFmpeg for DTS) takes long to
      # build; its layers are cached, so a change to the libass patch rebuilds
      # from that layer on.
      - name: Build the webOS SDK image
        uses: docker/build-push-action@v6
        with:
          context: tools
          file: tools/Dockerfile
          platforms: linux/arm64
          tags: nuvio-webos-sdk
          load: true
          cache-from: type=gha,scope=webos-sdk
          cache-to: type=gha,scope=webos-sdk,mode=max

      # tools/arm.sh builds the Rust MKV core and the DV7 converter on the host
      # for armv7-unknown-linux-gnueabi (static libraries).
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0
          "$CARGO_HOME/bin/rustup" target add armv7-unknown-linux-gnueabi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Install ares-package and qemu
        run: |
          npm install --prefix "$RUNNER_TEMP/ares" @webos-tools/cli
          echo "NUVIO_ARES_PACKAGE=$RUNNER_TEMP/ares/node_modules/.bin/ares-package" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static

      # Server keys (Supabase login, Trakt, TMDB...): tools/env.sh reads them
      # from local.properties. The repository keeps the file's whole text in
      # the LOCAL_PROPERTIES secret (the name build-tpk.yml uses);
      # NUVIO_LOCAL_PROPERTIES is the name some Android/LG workflows used,
      # read only if the first is empty. Neither set: a test .ipk with login
      # and those services off, and a warning on the run.
      - name: Server keys
        env:
          PROPS: ${{ secrets.LOCAL_PROPERTIES || secrets.NUVIO_LOCAL_PROPERTIES }}
          RELEASE_RUN: ${{ github.workflow == 'Release' }}
        run: |
          if [ -n "$PROPS" ]; then
            printf '%s\n' "$PROPS" > local.properties
            echo "local.properties from the secret ($(grep -c '=' local.properties) keys)"
            grep -q '^NUVIO_SUPABASE_URL=.' local.properties || echo "::warning::the secret has no NUVIO_SUPABASE_URL: login stays off"
          elif [ "$RELEASE_RUN" = true ]; then
            echo "::error::no LOCAL_PROPERTIES secret: a release build needs the server keys"; exit 1
          else
            echo "::warning::no LOCAL_PROPERTIES secret: the .ipk has no server keys (test build only)"
          fi

      - name: Verify libass on armv7
        run: bash tools/verify-ass-arm.sh 2>&1 | tee verify.log

      - name: Build the IPK
        run: |
          set -o pipefail
          bash tools/arm.sh --ipk --build 2>&1 | tee build.log

      - name: Build the high-cache IPK
        if: inputs.highcache
        run: |
          set -o pipefail
          bash tools/arm.sh --high-cache --ipk --build 2>&1 | tee build.log

      - name: Show build error summary
        if: failure()
        run: |
          {
            echo '### Build failed - last 60 lines'
            echo '```'
            tail -n 60 build.log 2>/dev/null || tail -n 60 verify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioIpk
          path: build/ipk/*.ipk
          if-no-files-found: error

  # Host regression tests from the LG donor work (Mateusz's lg-donor
  # workflow). They run beside the package build and never block it: a
  # failure shows on the run, the .ipk is still uploaded.
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    env:
      NUVIO_DTS_FFMPEG: '1'
      NUVIO_DV7: '1'
      NUVIO_RUST_MKVCORE: '1'
      NUVIO_WEBOS_HLS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install host test dependencies
        timeout-minutes: 6
        run: bash .github/build/host_deps.sh
      - name: P7 mapping settings, metadata and session isolation
        timeout-minutes: 6
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          bash tests/dv7_mapping_settings.sh
          bash tests/dv7.sh
          NV_TEST_P7_MAPPING=1 SANITIZE=1 bash tests/dts_playback.sh
      - name: Diagnostic QR absence and normal phone input
        timeout-minutes: 3
        run: |
          bash tests/no_qr_export.sh
          bash tests/dts_tv.sh
          CEL_TEST_LOOPBACK=1 SANITIZE=1 bash tests/celular.sh
      - name: Conversion refill and progressing HTTP gaps
        timeout-minutes: 3
        run: |
          SANITIZE=1 bash tests/video_packet_diag.sh
          NV_TEST_VIDEO_DIAG=1 SANITIZE=1 bash tests/dts_rebuffer.sh
          SANITIZE=1 bash tests/range_progress.sh
      - name: Native buffering regressions
        timeout-minutes: 8
        run: |
          bash tests/video_http_buffer.sh
          bash tests/video_http_buffer_build.sh
          bash tests/video_moviebuffer.sh
          bash tests/video_buffer_test_osd.sh
          SANITIZE=1 bash tests/video_buffering_state.sh
          bash tests/video_acb_lg.sh
          bash tests/player_loading.sh
          bash tests/player_truehd_notice.sh
          bash tests/truehd_conversion_ready.sh
          cc -std=c11 -Wall -Wextra -Werror -Isrc tests/player_dts_notice.c -o /tmp/dts-notice-test
          /tmp/dts-notice-test
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -Isrc tests/video_seekview.c -lm -o /tmp/seek-view-test
          /tmp/seek-view-test
          SANITIZE=1 bash tests/video_audio_mkv.sh
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc tests/mkv_dts.c -o /tmp/mkv_dts && /tmp/mkv_dts
          bash tests/lg_missing_subtitles.sh
          bash tests/dvaudio.sh
          bash tests/dvaudio_lg.sh
          bash tests/dts_pipeline.sh
          NV_TEST_MP4_BUILD=1 bash tests/dts_playback.sh
          cc -std=gnu11 -O1 -g -Wall -Wextra -Werror -Isrc src/cacheboost.c tests/buffer_tamanho.c -lpthread -lm -o /tmp/buffer-policy-test
          /tmp/buffer-policy-test
          cc -std=gnu11 -Wall -Wextra -Werror -Isrc -c src/dts/dts_engine.c -o /tmp/dts-noffmpeg.o
      - name: Consecutive MP4 seek reuse and bounded fallback
        timeout-minutes: 3
        run: NV_TEST_MP4=1 SANITIZE=1 bash tests/dts_playback.sh
      - name: TrueHD DV routing and audio controls
        timeout-minutes: 6
        run: |
          NV_TEST_TRUEHD=1 bash tests/dvaudio_lg.sh
          NV_TEST_TRUEHD=1 bash tests/video_acb_lg.sh
          NV_TEST_TRUEHD=1 SANITIZE=1 bash tests/dts_playback.sh
      - name: Fixed DV audio routing and local settings
        timeout-minutes: 8
        run: |
          bash tests/ajustes_secoes.sh
          bash tests/dv_fixed_audio_settings.sh
          bash tests/mp4_bd_settings.sh
          SANITIZE=1 bash tests/mp4_loading.sh
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/mp4_bd_rpu.c -o /tmp/mp4-rpu-test
          /tmp/mp4-rpu-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/mp4_hevc_sps.c -o /tmp/mp4-sps-test
          /tmp/mp4-sps-test
          NV_TEST_MP4=1 bash tests/dvaudio_lg.sh
          bash tests/player_buffer_data.sh
          bash tests/player_ram_controls.sh
          NV_TEST_MP4=1 bash tests/buffer_player_settings.sh
          bash tests/ajustes_dts_segmentado.sh
          bash tests/audioescolha.sh
          bash tests/audiomemoria.sh
          SANITIZE=1 bash tests/video_faixa_rotulo.sh
          NV_TEST_TRUEHD=1 NV_TEST_FIXED_AUDIO=1 NV_TEST_P7_MAPPING=1 bash tests/dvaudio_lg.sh
      - name: Build host FFmpeg and test real HTTP buffering
        timeout-minutes: 12
        env:
          NUVIO_DTS_HOST: '1'
          CC: gcc
          NUVIO_DTS_ROOT: /tmp/nuvio-dts-host
          NUVIO_DTS_JOBS: '3'
        run: |
          bash .github/build/host_ffmpeg.sh
          bash tests/moviebuffer.sh
          bash tests/moviebuffer.sh parallel
          bash tests/dts_buffer_reporting.sh
          bash tests/dts_cached_seek.sh
          SANITIZE=1 NV_TEST_CACHE_REUSE=1 bash tests/dts_cached_seek.sh
          bash tests/dts_range_retry.sh
          SANITIZE=1 bash tests/dts_resolver_reuse.sh
          SANITIZE=1 bash tests/http_connections.sh
          NV_TEST_HTTP_WORKERS=1 bash tests/dts_engine.sh
          SANITIZE=1 bash tests/hevc_structure_engine.sh
          SANITIZE=1 bash tests/hevc_annexb.sh
          SANITIZE=1 bash tests/hevc_annexb_engine.sh
          SANITIZE=1 bash tests/dts_conversion_stream.sh
          SANITIZE=1 bash tests/dts_off_engine.sh
      - name: Experimental HEVC SEI compatibility regressions
        timeout-minutes: 3
        run: |
          SANITIZE=1 bash tests/hevc_sei.sh
          NV_TEST_HEVC_SEI=1 NV_TEST_VIDEO_DIAG=1 bash tests/dts_pipeline.sh
      - name: WebOS HLS loopback and stream checks
        if: env.NUVIO_WEBOS_HLS == '1'
        timeout-minutes: 20
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          NUVIO_DV_TRUEHD: '1'
          NUVIO_DTS_ROOT: /tmp/nuvio-webos-hls-ffmpeg
          NUVIO_DTS_BUILD: /tmp/nuvio-webos-hls-ffmpeg-build
        run: |
          NUVIO_DTS_HOST=1 CC=gcc bash tools/build-dts-ffmpeg.sh
          bash tests/webos_hls.sh
      - name: DV7 conversion regressions
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          NUVIO_DTS_ROOT: /tmp/nuvio-dts-host
        run: |
          bash tests/dv7.sh
          bash tests/dv7_engine.sh
          NV_TEST_HTTP_WORKERS=1 NV_TEST_TRUEHD=1 bash tests/dv7_engine.sh
          NV_TEST_TRUEHD=1 bash tests/dv7_engine.sh
          NV_TEST_TRUEHD=1 NV_TEST_FIXED_AUDIO=1 NV_TEST_CACHE_REUSE=1 bash tests/dv7_engine.sh
          NV_TEST_P7_MAPPING=1 NV_TEST_TRUEHD=1 NV_TEST_FIXED_AUDIO=1 NV_TEST_CACHE_REUSE=1 bash tests/dv7_engine.sh
      - name: MP4 P7/P8 recovery and MKV isolation
        timeout-minutes: 12
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          NUVIO_DTS_ROOT: /tmp/nuvio-dts-host
        run: |
          SANITIZE=1 bash tests/mp4_bd_engine.sh
          NV_TEST_P7_MAPPING=1 SANITIZE=1 bash tests/mp4_bd_engine.sh
