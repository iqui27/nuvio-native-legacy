name: Build LG and Android

# LG webOS .ipk (tools/arm.sh --ipk --build) and Android .apk (tools/android.sh),
# the same scripts the owner runs locally, on GitHub's runners. MANUAL ONLY:
# Actions tab > "Build LG and Android" > "Run workflow", pick the branch and
# tick LG / high-cache / Android. Nothing runs on push. (GitHub lists manual
# workflows only once the file is on the default branch; after that the
# button builds any branch.)
#
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   LOCAL_PROPERTIES           the whole local.properties (Supabase, Trakt, Simkl,
#                              TMDB...), the name build-tpk.yml uses;
#                              NUVIO_LOCAL_PROPERTIES is read only if it is empty.
#                              Neither set: those integrations unconfigured.
#   NUVIO_ANDROID_KEYSTORE_B64 base64 of the release keystore, plus
#   NUVIO_KEYSTORE_PASS, NUVIO_KEY_ALIAS, NUVIO_KEY_PASS
#                              -> also the signed release APKs (full + lite).
#                              Without them only the debug APK is built.

on:
  workflow_dispatch:
    inputs:
      lg:
        description: "Build the LG webOS .ipk"
        type: boolean
        default: true
      lg_highcache:
        description: "Also build the LG high-cache .ipk"
        type: boolean
        default: false
      android:
        description: "Build the Android .apk"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-lg-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lg:
    name: LG webOS (.ipk)
    if: ${{ inputs.lg }}
    # The webOS SDK in tools/Dockerfile is an aarch64 build: an ARM runner runs
    # it natively (an x86 runner would need emulation for every compile).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      NUVIO_P2P_MOTOR: none            # the P2P engine lives on the owner's disk, not in the repo
      NUVIO_CTR: docker
      NUVIO_BUILD_PLATFORM: linux/arm64
      NUVIO_SDK_IMAGE: nuvio-webos-sdk
      NUVIO_BUILD_JOBS: "4"
      RUSTUP_HOME: /home/runner/.rustup
      CARGO_HOME: /home/runner/.cargo
      NUVIO_RELEASE_OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4

      - name: local.properties (optional secret)
        env:
          PROPS: ${{ secrets.LOCAL_PROPERTIES || secrets.NUVIO_LOCAL_PROPERTIES }}
        run: |
          if [ -n "$PROPS" ]; then
            printf '%s\n' "$PROPS" > local.properties
            echo "local.properties from the secret ($(grep -c '=' local.properties) keys)"
            grep -q '^NUVIO_SUPABASE_URL=.' local.properties || echo "::warning::the secret has no NUVIO_SUPABASE_URL: login stays off"
          else
            echo "::warning::no LOCAL_PROPERTIES secret: the build has no server keys (test build only)"
          fi

      # tools/Dockerfile: webOS cross SDK + libass + FFmpeg (DTS) + Rust. Layers
      # are cached in the GitHub Actions cache, so only the first run is slow.
      - uses: docker/setup-buildx-action@v3
      - name: webOS SDK image
        uses: docker/build-push-action@v6
        with:
          context: tools
          file: tools/Dockerfile
          platforms: linux/arm64
          tags: nuvio-webos-sdk
          load: true
          cache-from: type=gha,scope=webos-sdk
          cache-to: type=gha,scope=webos-sdk,mode=max

      # Host Rust builds the mkv core and the DV7 library for armv7 (tools/arm.sh).
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustup" toolchain install 1.88.0 --profile minimal
          "$CARGO_HOME/bin/rustup" default 1.88.0
          "$CARGO_HOME/bin/rustup" target add armv7-unknown-linux-gnueabi

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            rust/mkvcore/target
            build/dv7
          key: lg-cargo-${{ hashFiles('rust/mkvcore/Cargo.toml', 'rust/mkvcore/Cargo.lock', 'tools/dv7/Cargo.lock') }}

      - name: Object cache (ccache-arm / arm-objects)
        uses: actions/cache@v4
        with:
          path: |
            build/ccache-arm
            build/arm-objects
          key: lg-objects-${{ github.sha }}
          restore-keys: lg-objects-

      # ares-package (LG's packager) from the webOS CLI.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: webOS CLI
        run: |
          npm install -g @webos-tools/cli
          echo "NUVIO_ARES_PACKAGE=$(command -v ares-package)" >> "$GITHUB_ENV"

      - name: Build the .ipk
        run: |
          set -o pipefail
          mkdir -p "$NUVIO_RELEASE_OUT"
          bash tools/arm.sh --ipk --build 2>&1 | tee build-lg.log

      - name: Build the high-cache .ipk
        if: ${{ inputs.lg_highcache }}
        run: |
          set -o pipefail
          bash tools/arm.sh --high-cache --ipk --build 2>&1 | tee -a build-lg.log

      - uses: actions/upload-artifact@v4
        with:
          name: NuvioLG
          path: out/*.ipk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-lg-log
          path: build-lg.log
          if-no-files-found: ignore

  android:
    name: Android (.apk)
    if: ${{ inputs.android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NUVIO_P2P_MOTOR: none
      NUVIO_ANDROID_CACHE: /home/runner/.cache/nuvio-android
      RUSTUP_HOME: /home/runner/.rustup
      CARGO_HOME: /home/runner/.cargo
      NUVIO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4

      - name: local.properties (optional secret)
        env:
          PROPS: ${{ secrets.LOCAL_PROPERTIES || secrets.NUVIO_LOCAL_PROPERTIES }}
        run: |
          if [ -n "$PROPS" ]; then
            printf '%s\n' "$PROPS" > local.properties
            echo "local.properties from the secret ($(grep -c '=' local.properties) keys)"
            grep -q '^NUVIO_SUPABASE_URL=.' local.properties || echo "::warning::the secret has no NUVIO_SUPABASE_URL: login stays off"
          else
            echo "::warning::no LOCAL_PROPERTIES secret: the build has no server keys (test build only)"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android.sh pins NDK 27.2.12479018, platform 35, build-tools 35.0.0, cmake 3.22.1.
      # The runner image ships the SDK with sdkmanager; only these are added.
      - name: Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          SM=$SDK/cmdline-tools/latest/bin/sdkmanager
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" | grep -v '^\[' || true
          for d in ndk/27.2.12479018 platforms/android-35 build-tools/35.0.0 cmake/3.22.1; do test -d "$SDK/$d" || { echo "missing $d"; exit 1; }; done
          { echo "ANDROID_HOME=$SDK"; echo "ANDROID_SDK_ROOT=$SDK"; echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018"; } >> "$GITHUB_ENV"

      - name: Rust (Android targets for the mkv core)
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustup" target add aarch64-linux-android armv7-linux-androideabi

      # libcurl/libjpeg/libwebp (tools/android/deps.sh), the 16 KB-page Media3
      # FFmpeg (tools/android/ffmpeg-android.sh) and the SDL sources: slow to
      # build, keyed on their scripts.
      - name: Native deps cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUVIO_ANDROID_CACHE }}
          key: android-deps-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh', 'tools/android.sh') }}
          restore-keys: android-deps-

      # ffmpeg: tools/tizen-art.sh turns the .webp art into .png for the APK.
      - name: Host tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Native deps (curl, jpeg, webp)
        run: bash tools/android/deps.sh

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/**', 'android/gradle.properties') }}
          restore-keys: android-gradle-

      - name: Release keystore (optional secrets)
        env:
          KS: ${{ secrets.NUVIO_ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NUVIO_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.NUVIO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NUVIO_KEY_PASS }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "NUVIO_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "NUVIO_KEYSTORE_PASS=$KS_PASS"
              echo "NUVIO_KEY_ALIAS=$KEY_ALIAS"
              echo "NUVIO_KEY_PASS=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "ANDROID_MODE=" >> "$GITHUB_ENV"
            echo "release keystore present: debug + signed release"
          else
            echo "ANDROID_MODE=--debug-only" >> "$GITHUB_ENV"
            echo "no keystore secret: debug APK only"
          fi

      - name: Build the .apk
        run: |
          set -o pipefail
          bash tools/android.sh $ANDROID_MODE 2>&1 | tee build-android.log

      - uses: actions/upload-artifact@v4
        with:
          name: NuvioAndroid
          path: build/android/Nuvio-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-android-log
          path: build-android.log
          if-no-files-found: ignore
