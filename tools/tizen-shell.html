<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080,user-scalable=no">
<title>Nuvio</title>
<style>
  /* Fundo TRANSPARENTE de propriedade, nao por descuido. O AVPlay desenha num
     plano de hardware ATRAS da pagina; o que se ve dele e exatamente o que a
     pagina deixa passar. Um `background: #000` aqui apagaria o video inteiro e
     o sintoma seria uma tela preta com a interface por cima — o mesmo defeito
     que o app ja resolveu uma vez no webOS. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
               overflow: hidden; background: transparent; }
  /* O objeto do AVPlay ocupa a tela toda e fica na camada de baixo. Quem
     recorta a area do video e o proprio AVPlay (setDisplayRect), nao o CSS. */
  /* PAINEL DE DIAGNOSTICO NA TELA. Na TV nao ha DevTools a mao e o sintoma de
     falha e TELA PRETA, que nao diz nada. Este painel transforma a tela preta
     em texto que da para fotografar. Some sozinho quando o app desenha o
     primeiro quadro; se nao sumir, o que estiver escrito nele E o defeito. */
  #diag { position: absolute; left: 2%; top: 2%; right: 2%; z-index: 5;
          font: 18px/1.45 monospace; color: #b8f5c0; white-space: pre-wrap;
          background: rgba(0,0,0,.82); padding: 14px 18px; border-radius: 8px;
          max-height: 92%; overflow: hidden; }
  #diag .e { color: #ff8b7a; }
  /* ABERTURA, no lugar do painel tecnico.
     O que a pessoa via ate aqui era o userAgent, o SharedArrayBuffer e as
     cinco linhas de WebGL — diagnostico de quem esta consertando o port, nao
     de quem vai assistir um filme. E ela via isso do primeiro instante ate o
     primeiro quadro, que neste alvo inclui o preload do wasm e dos dados.
     O painel nao sumiu: ver a nota em #diag[hidden] mais abaixo.

     Fundo OPACO aqui e, ao contrario do body, correto: antes do primeiro
     quadro nao ha AVPlay tocando nada atras, e a abertura some exatamente no
     quadro em que poderia haver.

     NEUTRA (2.0 N1b): sem logo. O logo do app (Novo/Classico) e escolha do
     usuario, gravada pelo app; esta pagina roda antes do wasm e nao pode
     honra-la, entao so a barra de carga aparece, sobre o fundo liso da
     abertura do app (#0E0F12, o AB_FUNDO de src/abertura.c). O logo escolhido
     entra na abertura de dentro do app, sobre o mesmo fundo.
     O app entra desenhando esse mesmo fundo: a troca no primeiro quadro nao
     se percebe. */
  /* `top/left/right/bottom` POR EXTENSO, e nao `inset: 0`. O Chromium do
     Tizen 6.0 (Chrome 76) NAO conhece a abreviacao `inset` (Chrome 87+):
     ele ignorava a linha, o div ficava absoluto sem offset nenhum — encolhido
     ao tamanho do icone, no canto superior esquerdo — e o resto da tela era
     preto. Foi exatamente a foto do @rawldon: "tiny blue square with the play
     icon in the corner". No Chrome de mesa `inset` funciona e o defeito nao
     aparece, que e por que a conferencia local passou. */
  #abertura { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
              z-index: 4; background: #0E0F12;
              display: flex; flex-direction: column;
              align-items: center; justify-content: center; }
  /* Barra do preload. Sem nenhum movimento na tela, um arranque de dez
     segundos e indistinguivel de um travado — que e a duvida que o painel
     tecnico respondia por acidente.

     Ela e INDETERMINADA (vai e volta) so enquanto ninguem sabe a fracao. Assim
     que o Emscripten comeca a baixar o index.data ele informa quantos bytes de
     quantos, e ai a barra passa a dizer a VERDADE — ver Module.setStatus. Uma
     barra que anda sozinha fingindo progresso e pior que nenhuma: ela promete
     um fim que nao esta medindo. */
  #abertura .barra { margin-top: 40px; width: 320px; height: 4px;
                     border-radius: 2px; background: rgba(255,255,255,.14);
                     overflow: hidden; }
  #abertura .barra i { display: block; height: 100%; width: 30%;
                       border-radius: 2px; background: rgba(255,255,255,.75);
                       animation: nvCorre 1.4s ease-in-out infinite; }
  /* Fracao conhecida: para de vaguear e passa a crescer da esquerda. */
  #abertura .barra.medida i { animation: none; transform: none;
                              transition: width .25s linear; }
  @keyframes nvCorre { 0% { transform: translateX(-110%); }
                       100% { transform: translateX(440%); } }
  /* Mesmo motivo de #abertura: sem `inset` no Chromium desta TV. */
  #avPlayerObject { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                    z-index: 0; }
  /* O BUFFER de desenho continua 1920x1080 (atributos width/height do
     elemento); o que muda aqui e o TAMANHO EM TELA. Na TV os dois coincidem e
     nada disto tem efeito. No desktop a janela e menor que 1920x1080, e sem
     isto o navegador mostra o CANTO SUPERIOR ESQUERDO do canvas e corta o
     resto — parece que o app desenhou errado, e ele desenhou certo.

     !important porque o SDL escreve style.width/height no elemento ao criar a
     janela; regra de folha de estilo com !important ganha do inline.

     As quatro medidas juntas mantem 16:9 e cabem na janela: largura cheia
     limitada pela altura, ou altura cheia limitada pela largura. */
  #canvas { position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw !important; height: 56.25vw !important;
            max-width: 177.78vh !important; max-height: 100vh !important;
            z-index: 1; display: block; background: transparent;
            outline: none; }
</style>
</head>
<body>
<!-- O AVPlay so existe se este objeto existir. Nao e decorativo: `webapis.avplay`
     falha sem ele em varios firmwares. -->
<object id="avPlayerObject" type="application/avplayer"></object>
<!-- A ABERTURA fica ANTES do painel no DOM so por leitura; quem manda na
     sobreposicao e o z-index (abertura 4, diag 5): com o painel aberto por
     tecla ou pelo cao de guarda, e ele que fica por cima. -->
<div id="abertura"><div class="barra"><i></i></div></div>
<!-- NASCE ESCONDIDO. Ver o cao de guarda no fim do arranque: ele volta sozinho
     quando o primeiro quadro NAO chega, que e o unico caso em que ele tinha de
     estar na tela. A tecla verde tambem continua trazendo-o a qualquer hora. -->
<div id="diag" hidden>Nuvio: iniciando…</div>
<canvas id="canvas" width="1920" height="1080" tabindex="0"
        oncontextmenu="event.preventDefault()"></canvas>
<!-- CAMPO DO IME (src/entrada_texto.c). Invisivel e fora do caminho do
     ponteiro; so existe para o IME da Samsung ter onde escrever. -->
<input id="nvTextoCampo" type="text" autocomplete="off" autocorrect="off"
       spellcheck="false" aria-hidden="true" tabindex="-1"
       style="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0.01;
              border:0;padding:0;margin:0;color:transparent;background:transparent;
              caret-color:transparent;pointer-events:none;z-index:0">
<script>
  // DIAGNOSTICO DE ARRANQUE, e ele sai ANTES de qualquer coisa do app.
  //
  // Na TV nao ha DevTools a mao, mas `sdb dlog` carrega o console. Quando o app
  // da TELA PRETA nao ha nenhuma outra pista, e sem estas linhas a unica coisa
  // que se sabe e "nao apareceu". Cada uma responde uma pergunta que ja custou
  // rodada neste port:
  //
  //  - crossOriginIsolated / SharedArrayBuffer: os ~40 pthread_create do app
  //    exigem SAB. No desktop eu sirvo com COOP/COEP; dentro de um .wgt NAO HA
  //    CABECALHO HTTP NENHUM. Sem isolamento os workers nao sobem, o runtime
  //    fica preso em "still waiting on run dependencies: loading-workers", e o
  //    sintoma e exatamente tela preta depois de 100%.
  //  - WebGL: o Chromium da TV e mais velho que o do desktop. Contexto recusado
  //    ou shader que nao compila tambem da tela preta com o app "rodando".
  //  - avplay: diz se o plano de video existe neste firmware.
  (function () {
    // ENVIO DO LOG PARA UM COLETOR, quando houver um.
    //
    // A investigacao inteira deste port foi feita por FOTO DA TELA DA TV, e
    // isso custou rodadas: o painel guarda 34 linhas, o comeco rola, e cada
    // pergunta nova exigia outra viagem ate o aparelho. O log completo sempre
    // esteve no console — o que faltava era ele sair de la sozinho.
    //
    // DESLIGADO por padrao, e de proposito: so envia quando a build foi feita
    // com NUVIO_LOG_URL apontando para uma maquina que o dono escolheu. Log de
    // app carrega nome de titulo assistido e URL de fonte; nao e coisa para
    // sair da casa de alguem sem que a pessoa tenha pedido.
    //
    // Em lote de 2 s e com keepalive: uma requisicao por linha afogaria a TV, e
    // sem keepalive o ultimo lote — justamente o do travamento — se perde.
    var COLETOR = "@NUVIO_LOG_URL@";
    var fila = [];
    if (COLETOR && COLETOR.charAt(0) !== "@") {
      setInterval(function () {
        if (!fila.length) return;
        var corpo = fila.join("\n");
        fila = [];
        try {
          fetch(COLETOR, { method: "POST", body: corpo, keepalive: true,
                           headers: { "Content-Type": "text/plain" } });
        } catch (e) {}
      }, 2000);
      // O lote pendente na saida: sem isto o log para uma linha antes do que
      // interessa quando o app morre ou e fechado.
      addEventListener("pagehide", function () {
        if (!fila.length) return;
        try { navigator.sendBeacon(COLETOR, fila.join("\n")); } catch (e) {}
      });
    }
    window.__nvEnviar = function (t) {
      if (!COLETOR || COLETOR.charAt(0) === "@") return;
      fila.push(t);
      if (fila.length > 400) fila.splice(0, fila.length - 400);
    };

    var painel = document.getElementById("diag");
    var linhas = [];
    // A MESMA lista, em TEXTO PURO e sem o relogio formatado em HTML. Ela existe
    // para o painel de log EM C (src/registro.c) poder ler daqui: no webOS esse
    // painel le o fim de /tmp/nuvio.log, e aqui nao ha arquivo nenhum — o printf
    // do app chega em Module.print, passa por `mostrar` e morreria dentro deste
    // fechamento. Uma unica captura alimentando as duas formas de mostrar; um
    // segundo mecanismo de coleta daria dois logs que discordam.
    var nvLinhas = [];
    window.__nvLinhas = nvLinhas;
    // O LOG SOBREVIVE AO CRASH, em localStorage. Sem arquivo nesta TV, o
    // "Enviar registro" da Samsung mandava versao, plataforma e data — e nada
    // mais (os 5 crashes de #72 chegaram com 0 bytes). Aqui: nv-log recebe as
    // linhas desta sessao (ultimos 200 KB, gravado a cada 2 s e ao esconder
    // a pagina); no arranque, o que havia vira nv-log-anterior, que
    // src/avisos.c le pelo fio principal. Perde-se no maximo 2 s antes de
    // uma morte subita — o que interessa e o que veio antes.
    // A CADA 10 s, NAO 2: setItem de 200 KB e uma escrita sincrona em flash
    // pela IPC do navegador, no fio principal. A 2 s isso caia dentro de
    // quase toda janela de 3 s do relato de FPS e podia ser parte do `swap`
    // que estava sendo medido (registro 13). Perde-se no maximo 10 s de log
    // antes de uma morte subita.
    var nvLogTam = 0, nvLogPartes = [], nvLogSujo = false, NV_LOG_MAX = 200 * 1024;
    try {
      localStorage.setItem('nv-log-anterior', localStorage.getItem('nv-log') || '');
      localStorage.setItem('nv-log', '');
    } catch (e) {}
    function nvLogGravar() {
      if (!nvLogSujo) return;
      nvLogSujo = false;
      try {
        var t = nvLogPartes.join('\n');
        if (t.length > NV_LOG_MAX) { t = t.slice(t.length - NV_LOG_MAX); nvLogPartes = [t]; nvLogTam = t.length; }
        localStorage.setItem('nv-log', t);
      } catch (e) {}
    }
    // 30 s e nao 10: no Tizen 6 de 1 GB (registro 58 de 20/09/2026) o fio
    // principal parava 1-3 s em repouso, e o setItem de 200 KB no localStorage
    // (SQLite sincrono na TV) e um dos poucos trabalhos que este shell faz
    // nesse intervalo. Nao e prova — o longtask acima e quem vai dizer —, mas
    // e barato: perde-se no maximo 30 s de registro antes de uma morte subita,
    // e o pagehide continua gravando na hora.
    setInterval(nvLogGravar, 30000);
    document.addEventListener('visibilitychange', nvLogGravar);
    window.addEventListener('pagehide', nvLogGravar);
    // ARRANQUES SEGUIDOS QUE NAO CHEGARAM AO PRIMEIRO QUADRO. O contador sobe
    // aqui e o C zera no primeiro quadro (main.c). A partir de duas falhas,
    // entra em recovery: dados.c preserva todo /nuvio e evita apagar conta,
    // ajustes, catalogo e progresso. As artes continuam acessiveis sob demanda.
    var nvFalhas = 0;
    try {
      nvFalhas = parseInt(localStorage.getItem('nv-boot-falhas') || '0', 10) || 0;
      localStorage.setItem('nv-boot-falhas', String(nvFalhas + 1));
    } catch (e) {}
    window.__nvModoRecuperacao = nvFalhas >= 2;
    if (window.__nvModoRecuperacao) {
      console.warn("[arranque] recovery ativo apos " + nvFalhas + " falhas; dados pessoais preservados");
    }
    // BUILD DE DIAGNOSTICO (dono, 20/09/2026, para o #77: "manda uma build que
    // ja manda os logs pra gente"). So existe quando tizen.sh recebeu
    // NUVIO_DIAG_TOKEN: o placeholder fica no arquivo e nada disto arma. Com
    // ela, o registro da sessao ANTERIOR sobe no arranque (e o da sessao que
    // travou) e o desta sessao sobe a cada 30 s e ao sair — sem botao, e por
    // isso so numa build entregue a quem pediu, nunca na release. O token so
    // serve para gravar registro (ver servidor/recomendacoes, X-Nuvio-Auth:
    // diagnostico).
    var DIAG_TOKEN = "@NUVIO_DIAG_TOKEN@", DIAG_URL = "@NUVIO_REC_URL@";
    var diagLiga = DIAG_TOKEN.charAt(0) !== "@" && DIAG_URL.charAt(0) !== "@";
    var diagUltimo = "";
    function nvDiagEnviar(texto, quando) {
      if (!diagLiga || !texto || texto === diagUltimo) return;
      diagUltimo = texto;
      var tv = (navigator.userAgent.match(/Tizen [0-9.]+|SMART-TV[^;)]*/g) || ["tizen"]).join("_").replace(/\s+/g, "");
      try {
        fetch(DIAG_URL + "/v1/registro", {
          method: "POST", keepalive: true,
          headers: { "Authorization": "Bearer " + DIAG_TOKEN, "X-Nuvio-Auth": "diagnostico",
                     "Content-Type": "application/json" },
          body: JSON.stringify({ versao: "1.3.4-diag", plataforma: "tizen", quando: quando,
                                 texto: texto.slice(-200 * 1024), tv: tv, falhas: nvFalhas })
        }).catch(function () {});
      } catch (e) {}
    }
    if (diagLiga) {
      try {
        var ant = localStorage.getItem('nv-log-anterior') || '';
        if (ant) nvDiagEnviar(ant, 'anterior ' + new Date().toISOString().slice(0, 16) + ' falhas=' + nvFalhas);
      } catch (e) {}
      // PING DE ARRANQUE, antes de o wasm carregar: se a TV travar nos
      // primeiros segundos, isto e o que chega — UA, memoria e o contador.
      nvDiagEnviar('arranque ' + navigator.userAgent + ' | deviceMemory=' + (navigator.deviceMemory || '?') +
                   ' | cores=' + (navigator.hardwareConcurrency || '?') + ' | falhas=' + nvFalhas,
                   'arranque ' + new Date().toISOString().slice(0, 16));
      // Aos 5 s vai o comeco do registro desta sessao (as linhas NV-DIAG e o
      // arranque do C); depois, a cada 20 s, o registro inteiro.
      setTimeout(function () {
        nvLogGravar();
        try { nvDiagEnviar(localStorage.getItem('nv-log') || '', 'inicio ' + new Date().toISOString().slice(0, 16)); } catch (e) {}
      }, 5000);
      setInterval(function () {
        nvLogGravar();
        try { nvDiagEnviar(localStorage.getItem('nv-log') || '', 'auto ' + new Date().toISOString().slice(0, 16)); } catch (e) {}
      }, 20000);
      window.addEventListener('pagehide', function () {
        nvLogGravar();
        try { nvDiagEnviar(localStorage.getItem('nv-log') || '', 'saida ' + new Date().toISOString().slice(0, 16)); } catch (e) {}
      });
    }
    function pintar() {
      if (painel && !painel.hidden) painel.innerHTML = linhas.join("\n");
    }
    // Exposto porque quem mostra o painel de novo (o ouvinte da tecla, la
    // embaixo) esta fora deste fechamento e precisa repintar o que chegou
    // enquanto ele estava escondido.
    window.__nvPintar = pintar;
    // RELOGIO EM CADA LINHA. Sem ele, duas fotos do painel em pontos
    // diferentes nao distinguem "travou" de "esta andando devagar" — e foi
    // exatamente essa duvida que custou uma ida a TV: a primeira foto parava
    // numa linha, a segunda duas linhas adiante, e as duas leituras eram
    // compativeis com os dois diagnosticos.
    var t0 = Date.now();
    function mostrar(txt, erro) {
      var ms = Date.now() - t0;
      if (window.__nvEnviar) window.__nvEnviar((ms / 1000).toFixed(1) + "s " + txt);
      txt = (ms / 1000).toFixed(1).padStart(6) + "s  " + txt;
      // A copia em texto puro guarda MAIS que as 34 do painel DOM: o painel em C
      // rola, entao la o historico serve para algo. 200 e o tamanho do anel do
      // outro lado (REG_MAX em src/registro.c) — guardar mais aqui seria memoria
      // que ninguem le.
      nvLinhas.push(txt);
      if (nvLinhas.length > 200) nvLinhas.splice(0, nvLinhas.length - 200);
      nvLogPartes.push(txt); nvLogTam += txt.length + 1; nvLogSujo = true;
      if (nvLogTam > NV_LOG_MAX * 2) { var j = nvLogPartes.join('\n').slice(-NV_LOG_MAX); nvLogPartes = [j]; nvLogTam = j.length; }
      linhas.push(erro ? '<span class="e">' + txt + "</span>" : txt);
      // So as ultimas 34 linhas: a tela da TV nao tem mais que isso e o que
      // importa e o FIM, onde o arranque parou.
      if (linhas.length > 34) linhas = linhas.slice(-34);
      // SO PINTA QUANDO ESTA VISIVEL. A versao anterior reescrevia o innerHTML a
      // CADA linha de log, inclusive depois de o painel ficar escondido no
      // primeiro quadro — ou seja, um reflow do DOM por printf, para sempre, sem
      // ninguem olhando. O app fala centenas de linhas por minuto.
      pintar();
    }
    window.__nvDiag = mostrar;
    function d(k, v) { console.log("[NV-DIAG] " + k + " = " + v); mostrar(k + " = " + v); }
    try {
      d("userAgent", navigator.userAgent);
      d("crossOriginIsolated", (typeof crossOriginIsolated !== "undefined") ? crossOriginIsolated : "indefinido");
      d("SharedArrayBuffer", typeof SharedArrayBuffer);
      d("hardwareConcurrency", navigator.hardwareConcurrency);
      d("deviceMemory", navigator.deviceMemory);
      // O NAVEGADOR ENTREGA QUADROS? Um rAF proprio, fora do WASM, mede os
      // buracos entre quadros do navegador. Se ele para por segundos, nao e
      // codigo nosso: e o runtime da TV (memoria do sistema, GC, suspensao).
      // src/main.c le e zera no relato de FPS ([raf] max/lentos).
      window.__nvRaf = { max: 0, lentos: 0, ultimo: 0 };
      (function tick(t) {
        var r = window.__nvRaf;
        if (r.ultimo) { var g = t - r.ultimo; if (g > r.max) r.max = g; if (g > 500) r.lentos++; }
        r.ultimo = t;
        requestAnimationFrame(tick);
      })(performance.now());
      // TAREFAS LONGAS DO FIO PRINCIPAL, com AUTORIA. O rAF acima diz QUE o
      // fio parou; isto diz QUEM: o observer 'longtask' entrega cada tarefa
      // > 50 ms com a atribuicao do navegador (script, layout, gc...). E o
      // que separa "nosso wasm" de "runtime da TV" sem profiler no aparelho
      // (registro do Tizen 9 de 20/09/2026: swap de 200-480 ms sem que o C
      // estivesse fazendo nada). src/main.c le e zera no [navegador].
      window.__nvLong = { max: 0, n: 0, soma: 0, quem: "", fase: "" };
      try {
        new PerformanceObserver(function (lista) {
          var L = window.__nvLong;
          lista.getEntries().forEach(function (e) {
            L.n++; L.soma += e.duration;
            if (e.duration > L.max) {
              L.max = e.duration;
              L.fase = window.__nvFase || "?";
              var a = e.attribution && e.attribution[0];
              L.quem = e.name + (a ? "/" + a.containerType + (a.containerSrc ? ":" + a.containerSrc.slice(-24) : "") : "");
            }
          });
        }).observe({ entryTypes: ["longtask"] });
      } catch (e) { window.__nvLong.quem = "sem-observer"; }
      d("WebAssembly", typeof WebAssembly);
      d("tela", screen.width + "x" + screen.height +
               " / viewport " + window.innerWidth + "x" + window.innerHeight +
               " / dpr " + window.devicePixelRatio);
      d("avplay", (typeof webapis !== "undefined" && webapis && webapis.avplay) ? "presente" : "AUSENTE");
      var cv = document.createElement("canvas");
      var gl = cv.getContext("webgl", { alpha: true }) || cv.getContext("experimental-webgl", { alpha: true });
      if (!gl) { d("WebGL", "CONTEXTO RECUSADO"); }
      else {
        d("WebGL", gl.getParameter(gl.VERSION));
        d("WebGL/GLSL", gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
        d("WebGL/tamanho-max-textura", gl.getParameter(gl.MAX_TEXTURE_SIZE));
        var a = gl.getContextAttributes && gl.getContextAttributes();
        d("WebGL/alpha", a ? a.alpha : "?");
        d("WebGL/npot", !!gl.getExtension("OES_texture_npot"));
      }
    } catch (e) { console.log("[NV-DIAG] falhou: " + e); }

    // Erro nao capturado vira linha de log. Sem isto uma excecao no arranque
    // some e so sobra a tela preta.
    function fatal(text) {
      mostrar(text, 1);
      mostrar("Close and reopen Nuvio to recover. If this repeats, save this diagnostic.", 1);
      if (painel) { painel.hidden = false; pintar(); }
    }
    window.addEventListener("error", function (ev) {
      if (window.__nvHeapErro && window.__nvHeapErro(ev.message) === 'dup') { ev.preventDefault(); return; }
      var t = "ERRO: " + (ev.message || ev.type) +
              " @ " + (ev.filename || "?") + ":" + (ev.lineno || 0);
      console.log("[NV-ERRO] " + t); fatal(t);
    });
    window.addEventListener("unhandledrejection", function (ev) {
      var t2 = "ERRO promessa: " + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason);
      console.log("[NV-ERRO] " + t2); fatal(t2);
    });

    // CAO DE GUARDA DO ARRANQUE.
    //
    // O painel nascia visivel porque o defeito que ele existe para explicar —
    // TELA PRETA — nao avisa: se o primeiro quadro nunca chega, nao ha mais
    // nada na tela para ler. Esconde-lo sem mais faria toda falha de arranque
    // virar "abriu e ficou preto", sem uma linha sequer.
    //
    // A saida e trocar "sempre visivel" por "visivel quando FALHOU": passado o
    // prazo sem primeiro quadro, o painel volta sozinho com o log inteiro que
    // ele guardou em silencio — e a foto da tela continua valendo o mesmo.
    //
    // 25 s e folgado de proposito. O arranque normal aqui inclui o preload do
    // wasm e dos dados e depois todo o arranque em C; ver o [t] do marco
    // "primeiro quadro na tela" no log. Um prazo curto acusaria arranque lento
    // como se fosse falha, que e justamente o susto que este commit tira da
    // frente de quem so quer assistir.
    setTimeout(function () {
      if (window.__nvPrimeiroQuadro) return;
      mostrar("primeiro quadro nao veio em 25 s — abrindo o diagnostico", 1);
      var p = document.getElementById("diag");
      if (p) { p.hidden = false; pintar(); }
    }, 25000);
  })();

  // HEAP DO WASM ESCOLHIDO AQUI, NAO PELO GLUE (#205). Samsung 2020 de 1 GB
  // (deviceMemory=1, Chromium 69) abortava no arranque com "WebAssembly.
  // Memory(): could not allocate memory": o heap compartilhado de 256 MiB nao
  // cabe, e cada um dos 20 workers do pool repetia o erro (~17 linhas iguais,
  // [fios] livres=20 vivos=0). O wasm e ligado com o MINIMO de 160 MiB
  // (tools/tizen.sh) e a memoria compartilhada nasce aqui, do maior degrau que
  // o aparelho aceita para o menor; o glue a usa como esta (Module.wasmMemory)
  // e repassa a mesma aos workers. O pool acompanha o degrau (Module.nvPool,
  // lido pelo PTHREAD_POOL_SIZE do link): menos heap, menos workers.
  //   - deviceMemory <= 1 comeca em 192 MiB: o 256 ja falhou nesse porte.
  //   - falhou DEPOIS (o worker nao conseguiu a memoria que o fio principal
  //     conseguiu): grava o degrau seguinte em nv-heap-teto e recarrega UMA vez
  //     por degrau; sem degrau abaixo, mostra a mensagem. Os erros repetidos
  //     dos workers viram uma acao so.
  // NV-MEM-INICIO
  var NV_HEAP_DEGRAUS = [256, 192, 160];
  var NV_HEAP_POOL = { 256: 20, 192: 12, 160: 8 };
  function nvEscolherHeap(W, devMem, teto) {
    var max = (devMem > 0 && devMem <= 1) ? 192 : 256, erro = null;
    if (teto > 0 && teto < max) max = teto;
    for (var i = 0; i < NV_HEAP_DEGRAUS.length; i++) {
      var mib = NV_HEAP_DEGRAUS[i];
      if (mib > max) continue;
      try {
        return { mib: mib, pool: NV_HEAP_POOL[mib],
                 mem: new W.Memory({ initial: mib * 16, maximum: mib * 16, shared: true }) };
      } catch (e) { erro = e; }
    }
    return { mib: 0, erro: erro };
  }
  function nvHeapAbaixo(mib) {
    for (var i = 0; i < NV_HEAP_DEGRAUS.length; i++)
      if (NV_HEAP_DEGRAUS[i] < mib) return NV_HEAP_DEGRAUS[i];
    return 0;
  }
  // 'dup' = ja tratado, ignore; 'baixar' = recarregar com o degrau abaixo;
  // 'mostrar' = sem degrau, mostrar a mensagem; null = erro de outra coisa.
  function nvAcaoErroHeap(msg, st) {
    if (!/could not allocate memory|WebAssembly\.Memory/.test(String(msg))) return null;
    if (st.tratado) return 'dup';
    st.tratado = true;
    return nvHeapAbaixo(st.mib) ? 'baixar' : 'mostrar';
  }
  // NV-MEM-FIM
  var nvHeap = { mib: 0, tratado: false };
  (function () {
    var teto = 0;
    try { teto = parseInt(localStorage.getItem('nv-heap-teto') || '0', 10) || 0; } catch (e) {}
    var r = nvEscolherHeap(WebAssembly, navigator.deviceMemory || 0, teto);
    nvHeap.mib = r.mib; nvHeap.mem = r.mem; nvHeap.pool = r.pool;
    if (r.mem) {
      console.log("[mem] heap=" + r.mib + " MiB pool=" + r.pool + " deviceMemory=" + (navigator.deviceMemory || "?"));
    } else {
      console.log("[mem] sem heap: " + (r.erro && r.erro.message));
    }
    function aviso() {
      var d = document.createElement("div");
      d.style.cssText = "position:absolute;top:0;left:0;right:0;bottom:0;z-index:6;background:#0E0F12;" +
        "color:#fff;font:28px sans-serif;padding:120px 160px;line-height:1.5";
      d.textContent = "Nuvio could not start: this TV has too little free memory (WebAssembly heap " +
        "unavailable, deviceMemory=" + (navigator.deviceMemory || "?") + " GB). Close other apps or " +
        "restart the TV and open Nuvio again. / O Nuvio nao conseguiu abrir: memoria livre insuficiente " +
        "nesta TV. Feche outros apps ou reinicie a TV e abra de novo.";
      document.body.appendChild(d);
      var ab = document.getElementById("abertura");
      if (ab && ab.parentNode) ab.parentNode.removeChild(ab);
    }
    // Chamado pelo ouvinte de "error" do arranque (e logo abaixo, quando nem o
    // menor degrau coube: o glue ainda falha uma vez, e essa vira 'dup').
    window.__nvHeapErro = function (msg) {
      var a = nvAcaoErroHeap(msg, nvHeap);
      if (a === 'baixar') {
        try {
          localStorage.setItem('nv-heap-teto', String(nvHeapAbaixo(nvHeap.mib)));
          location.reload();
        } catch (e) { a = 'mostrar'; aviso(); }
      } else if (a === 'mostrar') aviso();
      return a;
    };
    if (!r.mem) window.__nvHeapErro("could not allocate memory");
  })();

  var Module = {
    // argv[1] e a pasta de arte. main() deriva fonts/ dela derrubando o ultimo
    // componente, entao /app/art => /app/fonts, que e onde o --preload-file
    // monta as fontes.
    arguments: ["/app/art"],
    // Memoria e pool escolhidos no bloco NV-MEM acima (undefined = o glue tenta
    // o minimo de 160 MiB sozinho e o erro unico vira a mensagem na tela).
    wasmMemory: nvHeap.mem,
    nvPool: nvHeap.pool,
    preRun: [function () {
      try {
        if (webapis.productinfo.isUdPanelSupported()) {
          ENV.NUVIO_PANEL_SIZE = "3840x2160";
          ENV.NUVIO_PANEL_SOURCE = "Tizen productinfo UHD panel";
        }
      } catch (_) { /* Native/system display fallback remains available. */ }
      try {
        var duid = webapis.productinfo.getDuid();
        if (duid) ENV.NUVIO_DEVICE_ID = "samsung:" + duid;
      } catch (_) { /* No model fallback: identical TVs must remain separate. */ }
      try {
        var model = webapis.productinfo.getModel();
        ENV.NUVIO_TV_MODEL = model;
        console.log("[tv] modelo=" + model);
      } catch (_) { /* Unknown panel keeps the 100% fallback. */ }
    }],
    canvas: (function () { return document.getElementById("canvas"); })(),
    // O QUE O RUNTIME JA SABIA E NINGUEM PERGUNTAVA. O Emscripten anuncia o
    // andamento do preload por aqui, em texto ("Downloading data... (8/28 MB)").
    // Com 28 MB de index.data essa e a maior parte da espera — e era justamente
    // o trecho em que a tela nao dizia nada. A fracao vai para a barra da
    // abertura; o texto inteiro vai para o painel, que e onde ele ajuda a
    // explicar um arranque travado.
    setStatus: function (t) {
      if (!t) return;
      // Progresso do preload chega ~150 vezes em 0,1 s: cada uma passava por
      // mostrar() (anel, log de 200 KB, repintura) no fio principal e comia o
      // anel de 200 linhas antes de o app falar. So o texto sem contagem e
      // cada degrau de 10 % vao ao painel; a barra continua a cada chamada.
      var mp = /\((\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\)/.exec(t);
      var passo = mp && parseFloat(mp[2]) > 0 ? Math.floor(parseFloat(mp[1]) / parseFloat(mp[2]) * 10) : -1;
      if (window.__nvDiag && (passo < 0 || passo !== Module.nvPassoPreload)) {
        Module.nvPassoPreload = passo;
        window.__nvDiag(t);
      }
      var barra = document.querySelector("#abertura .barra");
      if (!barra) return;
      var m = /\((\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\)/.exec(t);
      if (!m) return;
      var fim = parseFloat(m[2]);
      if (!(fim > 0)) return;
      var pct = Math.max(2, Math.min(100, (parseFloat(m[1]) / fim) * 100));
      barra.className = "barra medida";
      barra.firstChild.style.width = pct.toFixed(1) + "%";
    },
    print: function (t) {
      console.log(t);
      // O painel morre no primeiro quadro: dai em diante o app fala por si.
      if (window.__nvDiag) {
        window.__nvDiag(t);
        // ESCONDE, NAO REMOVE. A primeira versao arrancava o painel do DOM no
        // primeiro quadro, e isso deixou a sessao CEGA justamente quando o app
        // passou a arrancar e a travar mais adiante, na tela de login: nao havia
        // mais onde ler nada. O painel continua recebendo linhas em silencio e
        // volta com a tecla VERMELHA do controle.
        if (t.indexOf("primeiro quadro na tela") >= 0) {
          // A abertura sai AQUI e nao antes: o quadro que a substitui ja esta
          // desenhado, entao nao ha intervalo em que a tela fique vazia. Ela e
          // removida do DOM (o painel apenas se esconde) porque, ao contrario
          // dele, nao ha por que traze-la de volta — e o fundo OPACO dela
          // taparia o AVPlay, que desenha atras da pagina.
          var ab = document.getElementById("abertura");
          if (ab && ab.parentNode) ab.parentNode.removeChild(ab);
          var p = document.getElementById("diag");
          if (p) p.hidden = true;
          // A PARTIR DAQUI A TECLA VERMELHA E DO APP, e nao mais deste painel.
          // Ver a nota longa no ouvinte dela: com o C desenhando, o painel que o
          // dono quer e o de dentro do app — o mesmo que existe na TV da LG.
          window.__nvPrimeiroQuadro = 1;
        }
      }
    },
    printErr: function (t) { console.warn(t); if (window.__nvDiag) window.__nvDiag(t, 1); }
  };

  // TECLADO DA SAMSUNG PARA DIGITAR E PARA O BOTAO DE MICROFONE DAS BUSCAS
  // (src/entrada_texto.c). OK no campo abre o teclado da TV para digitar;
  // OK no botao de microfone abre o mesmo teclado, e a pessoa aperta o
  // microfone do controle e fala. O C chama
  // nvTexto.abrir/fechar por EM_ASM e LE seq/valor/fim a cada quadro; o JS
  // nunca chama o WASM. nvTexto.microfone: o que a TV diz de
  // http://tizen.org/feature/microphone (1 tem, 0 nao tem, -1 sem resposta);
  // o ajuste "Botao de microfone na busca" decide com isso.
  //
  // focus() por JS abre o IME porque o metadado
  // http://samsung.com/tv/metadata/use.keypad.without.useraction vale true por
  // padrao (guia "Keyboard/IME" da Samsung). Done = 65376, Cancel = 65385;
  // o resto do IME chega como keyCode 229 e o texto pelo evento input.
  // Enquanto o campo tem foco, as teclas NAO sobem ao window: o SDL escuta la,
  // e a letra entraria duas vezes (pelo IME e pelo KEYDOWN).
  // Este ouvinte de captura vem ANTES dos outros de keydown de proposito: o
  // Return (10009) com o IME aberto fecha so o IME, e nao o Spotlight.
  (function () {
    var t = { seq: 0, valor: "", fim: -1, aberto: false, microfone: -1 };
    try {
      if (window.tizen && tizen.systeminfo && tizen.systeminfo.getCapability)
        t.microfone = tizen.systeminfo.getCapability("http://tizen.org/feature/microphone") ? 1 : 0;
    } catch (e) { console.log("[texto] wgt: feature/microphone: " + e); }
    console.log("[texto] wgt: feature/microphone = " + t.microfone);
    var campo = function () { return document.getElementById("nvTextoCampo"); };
    function devolverFoco() {
      var c = document.getElementById("canvas");
      if (c) c.focus();
    }
    function terminar(confirmou, falhou) {
      if (!t.aberto) return;
      t.aberto = false;
      t.fim = falhou ? 2 : confirmou ? 1 : 0;
      var el = campo();
      if (el) el.blur();
      devolverFoco();
    }
    function ler() {
      var el = campo();
      if (!el || !t.aberto) return;
      if (el.value !== t.valor) { t.valor = el.value; t.seq++; }
    }
    t.abrir = function (atual, voz) {
      var el = campo();
      t.valor = atual || ""; t.fim = -1; t.aberto = true;
      t.seq++;
      if (el) {
        el.value = t.valor;
        try { el.focus(); } catch (e) { console.warn("[texto] wgt: focus: " + e); }
      }
      if (!el || document.activeElement !== el) {
        console.warn("[voice] keyboard startup failed: input did not receive focus");
        terminar(0, true); return;   // C ja abriu a sessao: devolve o cancelamento.
      }
      try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
      console.log("[texto] wgt: campo focado (voz=" + (voz ? 1 : 0) + ")");
    };
    t.fechar = function () {
      if (!t.aberto) return;
      t.aberto = false;
      var el = campo();
      if (el) el.blur();
      devolverFoco();
    };
    window.nvTexto = t;
    window.addEventListener("load", function () {
      var el = campo();
      if (!el) return;
      el.addEventListener("input", ler);
      el.addEventListener("compositionend", ler);
      el.addEventListener("change", ler);
      // O teclado da Samsung fechou sozinho (sem Concluido nem Voltar): o que
      // ja foi dito vale, como no .tpk.
      el.addEventListener("blur", function () { ler(); terminar(t.valor.trim() ? 1 : 0); });
      ["keydown", "keyup", "keypress"].forEach(function (tipo) {
        el.addEventListener(tipo, function (ev) {
          if (!t.aberto) return;
          ev.stopPropagation();
          if (tipo !== "keydown") return;
          if (ev.keyCode === 65376 || ev.keyCode === 13) { ev.preventDefault(); ler(); terminar(1); }
          else if (ev.keyCode === 65385 || ev.keyCode === 27) { ev.preventDefault(); ler(); terminar(0); }
        });
      });
    });
    window.addEventListener("keydown", function (ev) {
      if (!t.aberto || ev.keyCode !== 10009) return;
      ev.preventDefault();
      ev.stopImmediatePropagation();
      ler(); terminar(0);
    }, true);
  })();

  // Teclas do controle Samsung. Sem registrar, o firmware nao entrega nada alem
  // das setas e do OK — as coloridas, as de midia e o Return sao engolidas
  // pelo sistema. Equivale ao hint SDL_WEBOS_ACCESS_POLICY_KEYS_BACK do webOS.
  try {
    if (window.tizen && tizen.tvinputdevice) {
      // ChannelUp e o atalho de "Salvos" NO TIZEN, e a razao e o controle e nao
      // o software: os One Remote novos NAO tem fileira de cores. A azul chega
      // ao app, mas so depois de abrir a barra de cores pelo botao de numeros —
      // ninguem faz isso por um atalho. O rocker CH e botao FISICO em todo
      // controle Samsung e o app nao usa canal para nada. Na LG a azul continua,
      // que e onde ela funciona bem.
      ["MediaPlay", "MediaPause", "MediaPlayPause", "MediaStop",
       "MediaRewind", "MediaFastForward", "ChannelUp", "ChannelDown",
       "ColorF0Red", "ColorF1Green", "ColorF2Yellow", "ColorF3Blue", "Search"]
        .forEach(function (k) {
          try { tizen.tvinputdevice.registerKey(k); } catch (e) {}
        });
    }
  } catch (e) {}

  // O QUE ESTE CONTROLE TEM DE VERDADE, dito pela propria TV.
  //
  // Registrar uma tecla nao prova que ela EXISTE no controle da pessoa. Os
  // controles Samsung novos (One Remote) nao tem fileira de cores: chegar na
  // azul exige abrir a barra de cores pelo botao de numeros, e ninguem faz isso
  // para um atalho. Escolher a tecla substituta no chute custa uma versao
  // inteira; getSupportedKeys() responde de graca, e a linha sai no painel de
  // log — entao quem relatar um defeito ja manda junto o que o aparelho dele
  // aceita.
  //
  // So os NOMES, uma linha, no arranque. Nao muda comportamento nenhum.
  try {
    if (window.tizen && tizen.tvinputdevice &&
        tizen.tvinputdevice.getSupportedKeys) {
      var ks = tizen.tvinputdevice.getSupportedKeys() || [];
      var nomes = [];
      for (var i = 0; i < ks.length; i++) nomes.push(ks[i].name);
      console.log("[tecla] a TV aceita " + ks.length + ": " + nomes.join(" "));
    }
  } catch (e) {}

  // MEDIDOR DE WORKERS. Existe porque a TV travou DE VEZ — nem a tecla
  // vermelha respondia, e o listener dela e JS no fio principal. Isso nao e
  // aborto (aborto aparece como erro no painel): e o FIO PRINCIPAL BLOQUEADO.
  //
  // A causa documentada mais provavel para esse quadro no Emscripten e o pool
  // de pthreads esgotado: quando nao ha worker livre, criar um exige que o fio
  // principal volte ao laco de eventos; se ele estiver esperando justamente
  // esse fio, ninguem anda. O app tem 41 pontos de pthread_create.
  //
  // Em vez de chutar um numero para o pool de novo — ja errei duas vezes assim
  // nesta investigacao — isto MEDE. PThread.runningWorkers e unusedWorkers sao
  // do proprio runtime. Se "livres" chegar a zero antes do travamento, o pool e
  // a causa e o numero certo sai da medicao. Se nunca chegar perto, nao e o
  // pool e eu procuro em outro lugar.
  //
  // O log sai a cada 3 s, junto do relatorio de fps, e vai para o console — que
  // o `sdb dlog` carrega mesmo depois de o painel congelar.
  setInterval(function () {
    try {
      // Pelo Module, nunca pela global: ler a global de um simbolo NAO
      // exportado dispara o abort() do runtime, e o medidor mataria o app.
      // Este emscripten expoe unusedWorkers, e NAO runningWorkers — a primeira
      // versao disto testava runningWorkers e saia calada, sem imprimir nada.
      // O que interessa e justamente o numero de LIVRES: e ele que chega a zero
      // quando o pool vira o teto.
      var PT = Module.PThread;
      if (!PT || !PT.unusedWorkers) return;
      var livres = PT.unusedWorkers.length;
      var pth = PT.pthreads ? Object.keys(PT.pthreads).length : -1;
      var t = "[fios] livres=" + livres + " vivos=" + pth +
              (livres === 0 ? "  <<< POOL NO LIMITE" : "");
      console.log(t);
      if (window.__nvDiag) window.__nvDiag(t, livres === 0);
    } catch (e) {}
  }, 3000);

  // Captura vem antes do campo: os atalhos nao podem agir por baixo do IME.
  // So retorna dos tradutores; nao impede input, composicao nem Done/Cancel.
  function imeAberto() { return window.nvTexto && window.nvTexto.aberto; }

  // TECLA RETURN DO CONTROLE SAMSUNG -> Escape.
  //
  // No webOS o botao de voltar chega ao SDL como SDLK_AC_BACK e o app ja o
  // trata em toda tela. Na Samsung ele e o keyCode 10009 (XF86Back), que nao
  // existe na tabela do SDL: o evento chega ao navegador e MORRE ali, sem virar
  // tecla nenhuma para o C. O sintoma e o botao de voltar nao fazer nada dentro
  // de uma lista — que e onde nao ha outra saida.
  //
  // Traduzir aqui e melhor que ensinar o C a conhecer 10009: o codigo de voltar
  // ja existe e e o mesmo dos outros dois alvos; o que faltava era a tecla
  // chegar. Escape porque as telas ja o aceitam ao lado de AC_BACK.
  ["keydown", "keyup"].forEach(function (tipo) {
    window.addEventListener(tipo, function (ev) {
      if (imeAberto()) return;
      if (ev.keyCode !== 10009) return;
      ev.preventDefault();
      ev.stopPropagation();
      var alvo = document.getElementById("canvas") || window;
      // Preserve the physical release; repeats must not clear the Back guard.
      alvo.dispatchEvent(new KeyboardEvent(tipo, {
        key: "Escape", code: "Escape", keyCode: 27, which: 27,
        repeat: ev.repeat, bubbles: true, cancelable: true
      }));
    }, true);
  });

  // TECLAS DE MIDIA DO CONTROLE SAMSUNG -> as teclas que player.c ja entende.
  //
  // Registrar a tecla (acima, no tizen.tvinputdevice.registerKey) so faz o
  // firmware ENTREGAR o evento ao app; nao basta. O keyCode que chega
  // (10252, 415, 19, 413, 412, 417) nao existe na tabela do SDL — o
  // Emscripten so conhece teclado de PC — entao o evento morre no navegador
  // exatamente como o 10009 do Return acima, so que sem nenhuma linha no
  // painel de log dizendo isso: o botao "nao faz nada" e nao ha pista.
  // player_evento() (src/player.c) alterna play/pause em SDLK_RETURN,
  // SDLK_KP_ENTER ou SDLK_SPACE; nao existe tratamento de tecla de midia
  // nenhuma em C. Traduzir aqui, e nao ensinar o C a conhecer estes
  // keyCodes, pelo mesmo motivo do 10009: a tecla de OK ja faz o certo em
  // todo estado do player (painel de pausa, barra em foco, botao PLAY em
  // foco), reimplementar isso a partir do zero para um keyCode novo so
  // duplicaria a logica e divergiria dela com o tempo.
  //
  // Controles Samsung de 2023+ (ex.: QN90D) tem UMA tecla fisica de
  // play/pause, que manda MediaPlayPause (10252) — nao Play e Pause
  // separados. MediaPlay/MediaPause ficam para controles mais antigos ou
  // remotos por app. Os tres alternam o mesmo estado aqui porque o app so
  // tem um alternarTocando(), sem estado de "play" e "pause" pedidos
  // separadamente pelo controle.
  var MEDIA_TECLA = {
    // Play/Pause viram a tecla Pause do teclado (SDLK_PAUSE no SDL), e NAO
    // Enter: com os controles em pe o Enter aperta o botao em foco, e com o
    // foco em Legendas o "pause" abria a folha de legendas (#109). O C trata
    // SDLK_PAUSE em player_evento: alterna e poe o foco no Play.
    10252: { key: "Pause", code: "Pause", keyCode: 19 },  // MediaPlayPause
    415:   { key: "Pause", code: "Pause", keyCode: 19 },  // MediaPlay
    19:    { key: "Pause", code: "Pause", keyCode: 19 },  // MediaPause
    413:   { key: "Escape", code: "Escape", keyCode: 27 }, // MediaStop
    412:   { key: "ArrowLeft", code: "ArrowLeft", keyCode: 37 },  // MediaRewind
    417:   { key: "ArrowRight", code: "ArrowRight", keyCode: 39 } // MediaFastForward
  };
  // SO COM O PLAYER NA TELA. player.c escreve window.nvPlayerAberto nas
  // transicoes de abrir/fechar. Sem esta guarda, play/pause na home ou num
  // menu de contexto viraria um OK em cima do que estivesse em foco — e o
  // menu tem "marcar como visto". Fora do player a tecla e engolida, nao
  // repassada: o app nao tem nada util para fazer com ela ali.
  window.addEventListener("keydown", function (ev) {
    if (imeAberto()) return;
    // O evento que ESTE listener despacha tambem passa por aqui (captura no
    // window), e o Pause traduzido tem o mesmo keyCode 19 da tecla MediaPause:
    // sem esta guarda ele se redespacharia para sempre.
    if (!ev.isTrusted) return;
    var alvoTecla = MEDIA_TECLA[ev.keyCode];
    if (!alvoTecla) return;
    if (!window.nvPlayerAberto) { ev.preventDefault(); ev.stopPropagation(); return; }
    ev.preventDefault();
    ev.stopPropagation();
    var alvo = document.getElementById("canvas") || window;
    ["keydown", "keyup"].forEach(function (t) {
      alvo.dispatchEvent(new KeyboardEvent(t, {
        key: alvoTecla.key, code: alvoTecla.code,
        keyCode: alvoTecla.keyCode, which: alvoTecla.keyCode,
        bubbles: true, cancelable: true
      }));
    });
  }, true);

  // DOIS PAINEIS DE LOG, UMA TECLA VERMELHA — e por isso ela troca de dono.
  //
  // Agora existe um painel de log EM C (src/registro.c), que o dono abre com a
  // vermelha nas DUAS TVs: no webOS nao ha shell nenhum e um painel em DOM la e
  // impossivel. Mas o painel DOM daqui nao pode simplesmente sair: ele sobrevive
  // a coisas que o painel em C nao sobrevive, porque nao depende do laco de
  // quadro — tela preta antes do primeiro quadro, contexto WebGL recusado,
  // abort() do runtime. Foi para esses casos que ele nasceu.
  //
  // A regra, entao, e por ESTADO e nao por preferencia:
  //   antes do primeiro quadro  -> a vermelha e do painel DOM (o C nao desenha)
  //   depois do primeiro quadro -> a vermelha vai para o app
  //   a qualquer momento        -> a VERDE traz o painel DOM de volta
  // A verde ja e registrada acima (ColorF1Green) e o app nao a usa. Ela e a
  // saida para "o C parou de desenhar depois de ter desenhado": ai a vermelha
  // vai para um app que nao pinta mais nada, e sem a verde nao haveria mais como
  // ler nada. (Com o FIO PRINCIPAL bloqueado nenhuma das duas responde — o
  // ouvinte tambem e JS no fio principal. Isso continua sem solucao aqui e esta
  // descrito no medidor de workers, acima.)
  //
  // O 403 NAO E REPASSADO ao SDL: o keyCode das coloridas da Samsung nao existe
  // na tabela do SDL e o evento morreria no navegador, exatamente como o 10009
  // do Return. Vira um F9 sintetico, que e a tecla que registro.c escuta nos
  // tres alvos.
  function mostrarPainelDOM() {
    var p = document.getElementById("diag");
    if (!p) return;
    p.hidden = !p.hidden;
    if (!p.hidden && window.__nvPintar) window.__nvPintar();
  }
  window.addEventListener("keydown", function (ev) {
    if (imeAberto()) return;
    // 403 = ColorF0Red, 404 = ColorF1Green, 427 = ChannelUp, 428 = ChannelDown.
    // F1/F2/F3/F4 servem para testar no desktop.
    var vermelha = (ev.keyCode === 403 || ev.key === "F1");
    var verde    = (ev.keyCode === 404 || ev.key === "F2");
    var canal    = (ev.keyCode === 427 || ev.key === "F3");
    var canalMenos = (ev.keyCode === 428 || ev.key === "F4");
    if (!vermelha && !verde && !canal && !canalMenos) return;
    ev.preventDefault();
    ev.stopPropagation();
    // CANAL+ ABRE "SALVOS" (toque) E A CENTRAL DE CONTROLE (segurado). O
    // keyCode 427 nao existe na tabela do SDL e morreria no navegador, igual as
    // coloridas: vira um F7 sintetico SO NA DESCIDA; a subida sai no ouvinte de
    // keyup abaixo. main.c (central.h) mede o tempo entre os dois e, no toque
    // curto, entrega o "s" de sempre.
    if (canal) {
      var alvoS = document.getElementById("canvas") || window;
      alvoS.dispatchEvent(new KeyboardEvent("keydown", {
        key: "F7", code: "F7", keyCode: 118, which: 118,
        bubbles: true, cancelable: true
      }));
      return;
    }
    // CANAL- (428) VIRA F8, o par do F7: o C faz dele o zap com canal na tela
    // e o Spotlight fora disso (main.c remapCanal). Descida e subida.
    if (canalMenos) {
      var alvoM = document.getElementById("canvas") || window;
      alvoM.dispatchEvent(new KeyboardEvent("keydown", {
        key: "F8", code: "F8", keyCode: 119, which: 119,
        bubbles: true, cancelable: true
      }));
      return;
    }
    if (verde || !window.__nvPrimeiroQuadro) { mostrarPainelDOM(); return; }
    // O par keydown+keyup completo: mandar so o keydown deixa a tecla presa
    // para o SDL, e registro.c usa o keyup para nao vazar o toque adiante.
    var alvo = document.getElementById("canvas") || window;
    ["keydown", "keyup"].forEach(function (t) {
      alvo.dispatchEvent(new KeyboardEvent(t, {
        key: "F9", code: "F9", keyCode: 120, which: 120,
        bubbles: true, cancelable: true
      }));
    });
  }, true);

  // A SUBIDA DO CANAL+ (ver o ouvinte acima): F7 keyup, para o C saber que a
  // tecla foi solta. Sem ela o toque curto sai pelo silencio (chsegura.h).
  window.addEventListener("keyup", function (ev) {
    if (imeAberto()) return;
    var mais = (ev.keyCode === 427 || ev.key === "F3");
    var menos = (ev.keyCode === 428 || ev.key === "F4");
    if (!mais && !menos) return;
    ev.preventDefault();
    ev.stopPropagation();
    var alvoS = document.getElementById("canvas") || window;
    alvoS.dispatchEvent(new KeyboardEvent("keyup", mais ? {
      key: "F7", code: "F7", keyCode: 118, which: 118,
      bubbles: true, cancelable: true
    } : {
      key: "F8", code: "F8", keyCode: 119, which: 119,
      bubbles: true, cancelable: true
    }));
  }, true);

  // SPOTLIGHT (src/spotlight.h). A tecla "Search" (10225, controles Samsung de
  // botao de busca) vira F6 = abrir pela voz; a AMARELA (405) vira F5 = abrir.
  // Os dois keyCodes nao existem na tabela do SDL e morreriam aqui, como o
  // 10009 do Return. A tecla de MICROFONE do Smart Remote nao esta entre as
  // registraveis do tizen.tvinputdevice: se ela chegar, a linha abaixo conta.
  window.addEventListener("keydown", function (ev) {
    if (imeAberto()) return;
    if (!ev.isTrusted) return;
    var f = ev.keyCode === 10225 ? "F6" : ev.keyCode === 405 ? "F5" : null;
    if (!f) return;
    ev.preventDefault();
    ev.stopPropagation();
    var alvo = document.getElementById("canvas") || window;
    var code = f === "F6" ? 117 : 116;
    ["keydown", "keyup"].forEach(function (t) {
      alvo.dispatchEvent(new KeyboardEvent(t, {
        key: f, code: f, keyCode: code, which: code,
        bubbles: true, cancelable: true
      }));
    });
  }, true);
  // TECLA QUE O SDL NAO CONHECE, uma linha por keyCode por sessao, como o
  // "[tecla] scancode=" do C: e assim que se descobre o que o controle da
  // pessoa manda (o microfone, por exemplo) sem build instrumentada.
  (function () {
    var vistos = {};
    window.addEventListener("keydown", function (ev) {
      if (!ev.isTrusted || ev.keyCode < 300 || vistos[ev.keyCode]) return;
      vistos[ev.keyCode] = 1;
      var t = "[tecla] wgt keyCode=" + ev.keyCode + " key=" + ev.key;
      console.log(t);
      if (window.__nvDiag) window.__nvDiag(t);
    }, true);
  })();

  // O SDL le o teclado do elemento com foco. Sem isto o app abre e nao responde
  // ao controle, o que parece travamento e nao falta de foco.
  window.addEventListener("load", function () {
    var c = document.getElementById("canvas");
    if (c) c.focus();
  });
</script>
