name = "nuvio-recomendacoes"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "nuvio-recomendacoes"
database_id = "fbea4764-9125-474e-ae4e-875d2e21b2fc"

# TV VIDAA: o site e o proxy dela vivem no worker nuvio-tv (servidor/tv). Este
# binding so repassa /tv/* e /v1/proxy para la (ver index.js). NUNCA ponha
# [assets] aqui de novo: todo deploy sem o site montado apagava a pagina da TV.
[[services]]
binding = "TV"
service = "nuvio-tv"

# CRIADORES: contas que levam o selo "Criador" ao lado do nome (amigos.js,
# seloDe). Ids canonicos separados por virgula; cada perfil da conta
# (`...:<n>`) conta tambem. O id nao e segredo e nunca sai nas respostas.
[vars]
CRIADORES = "nuvio:88376366-769b-41ec-858e-f62a04a70543"

# Limpeza da retencao de 90 dias.
[triggers]
crons = ["17 4 * * *"]

# Segredos (nao vao aqui; use `wrangler secret put`):
#   TRAKT_CLIENT_ID     client id do aplicativo no Trakt
#   SUPABASE_URL        url do projeto Supabase do Nuvio (so para verificar o token)
#   SUPABASE_ANON_KEY   anon key do mesmo projeto
#   TMDB_KEY            chave da API do TMDB (/v1/filmografia da Caca; sem ela a TV
#                       pergunta ao TMDB direto). `wrangler secret put TMDB_KEY`
# Opcional em [vars]: TRILHA_TRAKT_TOP250 = "<id numerico da lista publica do Trakt>"
#   (o dono escolhe a lista dos "250 mais bem avaliados"; sem ela so o TMDB).
