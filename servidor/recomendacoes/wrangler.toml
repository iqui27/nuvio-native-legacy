name = "nuvio-recomendacoes"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "nuvio-recomendacoes"
database_id = "fbea4764-9125-474e-ae4e-875d2e21b2fc"

# Channel categories, cached 30 days. Wrangler provisions KV on a future deploy.
[[kv_namespaces]]
binding = "CATS"

# Music soundtrack lookups (musica.js), cached 30 days (7 when nothing found).
[[kv_namespaces]]
binding = "MUS"

# TV VIDAA: o site e o proxy dela vivem no worker nuvio-tv (servidor/tv). Este
# binding so repassa /tv/* e /v1/proxy para la (ver index.js). NUNCA ponha
# [assets] aqui de novo: todo deploy sem o site montado apagava a pagina da TV.
[[services]]
binding = "TV"
service = "nuvio-tv"

# CRIADORES: contas que levam o selo "Criador" ao lado do nome (amigos.js,
# seloDe). Ids canonicos separados por virgula; cada perfil da conta
# (`...:<n>`) conta tambem. O id nao e segredo e nunca sai nas respostas.
[vars]
CRIADORES = "nuvio:88376366-769b-41ec-858e-f62a04a70543"
# Chave publica confirmada pela Nuvio. Sem esta var, usa SUPABASE_URL +
# /auth/v1/.well-known/jwks.json. SUPABASE_URL e segredo, nao tem valor aqui.
NUVIO_JWKS_URL = "https://api.nuvio.tv/auth/v1/.well-known/jwks.json"
# WATCH TOGETHER: onde moram as salas (Worker nuvio-juntos, servidor/juntos).
# As rotas /v1/sala* respondem 503 enquanto o segredo SALA_SEGREDO nao existir
# aqui E la, e a TV esconde o recurso.
JUNTOS_URL = "https://nuvio-juntos.henriquef29.workers.dev"

# Limpeza da retencao de 90 dias.
[triggers]
crons = ["17 4 * * *"]

# Optional Apple Music catalog secrets (names only; no values in this file):
#   APPLE_MUSIC_TEAM_ID
#   APPLE_MUSIC_KEY_ID
#   APPLE_MUSIC_P8
# All three enable catalog search first; otherwise MusicBrainz/iTunes is used.
# ES256 developer tokens stay in worker memory for up to 12 hours, never in KV.
# Request country=br selects the storefront (default us); cache is storefront-specific.
# Segredos (nao vao aqui; use `wrangler secret put`):
#   TYPESAFE_KEY        Jev HTTP API key for Live TV category suggestions
#   TRAKT_CLIENT_ID     client id do aplicativo no Trakt
#   SUPABASE_URL        url do projeto Supabase do Nuvio (/user e default da JWKS)
#   SUPABASE_ANON_KEY   anon key do mesmo projeto
#   SALA_SEGREDO        assina os bilhetes do Watch Together; o MESMO valor no
#                       nuvio-juntos (tools/juntos-publicar.sh --segredo)
#   TMDB_KEY            chave da API do TMDB (/v1/filmografia da Caca; sem ela a TV
#                       pergunta ao TMDB direto). `wrangler secret put TMDB_KEY`
# Opcional em [vars]: TRILHA_TRAKT_TOP250 = "<id numerico da lista publica do Trakt>"
#   (o dono escolhe a lista dos "250 mais bem avaliados"; sem ela so o TMDB).
