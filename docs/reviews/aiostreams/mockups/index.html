<!doctype html>
<html lang="en">
<head>

<title>AIOStreams · TV dashboard approval</title>
<style>
@font-face{font-family:InterDisplay;src:url('../../../../deploy/app/fonts/InterDisplay-Regular.ttf');font-weight:400}
@font-face{font-family:InterDisplay;src:url('../../../../deploy/app/fonts/InterDisplay-Bold.ttf');font-weight:700}
:root{--accent:#bdd5d0;--ink:#F3F2EF;--muted:rgba(243,242,239,.62);--soft:rgba(243,242,239,.48);--surface:rgba(14,15,18,.80);--focus:rgba(243,242,239,.13);--ok:#b6d3bd;--warn:#dec58d;--bad:#e7aaa4}
*{box-sizing:border-box}body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d0d0d;color:var(--ink);font:400 23px InterDisplay,sans-serif}body.solid{--surface:#121316;--focus:#2b2d34}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus{outline:0}.icon{width:28px;height:28px;vertical-align:middle;opacity:.8;filter:brightness(0) invert(.93);flex-shrink:0}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}.tiny{font-size:16px;color:var(--soft)}.mono{font-variant-numeric:tabular-nums}.kicker{font-size:15px;letter-spacing:.14em;font-weight:700;text-transform:uppercase;color:var(--soft)}
.clock{position:absolute;left:48px;top:30px;height:64px;min-width:274px;border-radius:36px;background:var(--surface);padding:17px 26px;display:flex;gap:16px;align-items:center;font-size:19px;box-shadow:0 8px 24px #0003}.clock .icon{width:24px;height:24px}.brand{position:absolute;right:68px;top:48px;letter-spacing:.22em;font-size:20px;font-weight:700;color:var(--soft)}
.sheet{position:absolute;inset:124px 48px 56px;background:var(--surface);border-radius:28px;box-shadow:0 12px 32px #0005;padding:38px 44px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:40px;line-height:1.15;margin:8px 0 0;font-weight:700}h2{font-size:32px;margin:0 0 10px;font-weight:700}h3{font-size:24px;margin:0;font-weight:700}p{margin:0;line-height:1.45}.header-right{display:flex;align-items:center;gap:28px}.chip{height:56px;border-radius:30px;background:#f3f2ef14;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:19px}.chip:focus{background:var(--accent);color:#172321}.chip:focus .icon{filter:brightness(0);opacity:.8}.chip:disabled{opacity:.4;cursor:default}.segments{display:flex;gap:4px;background:#f3f2ef0d;border-radius:32px;width:max-content;padding:5px;margin-bottom:28px}.segment{height:48px;padding:0 28px;border-radius:28px;background:transparent;font-size:19px;color:var(--muted)}.segment.selected{background:#f3f2ef20;color:var(--ink)}.segment:focus{background:#f3f2ef30;color:var(--ink)}
.content{height:606px}.verdict{display:flex;gap:17px;align-items:flex-start;margin-bottom:26px}.verdict>.icon{width:36px;height:36px;margin-top:4px}.verdict p{font-size:23px;color:var(--muted)}.columns{display:grid;grid-template-columns:1.07fr 1fr;gap:56px}.label{font-size:19px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:98px;padding:18px 22px;border-radius:22px;background:transparent;width:100%;text-align:left}.row:focus{background:var(--focus)}.row .left{display:flex;align-items:center;gap:20px}.row p{font-size:19px;color:var(--muted);margin-top:5px}.row .right{display:flex;gap:24px;align-items:center;text-align:right}.row .right .icon{width:22px}.section-title{display:flex;align-items:center;justify-content:space-between;padding:0 0 16px;border-bottom:1px solid #f3f2ef14;margin-bottom:12px}.section-title span{font-size:19px;color:var(--muted)}.note{font-size:19px;line-height:1.45;color:var(--muted);max-width:65ch}.divider{height:1px;background:#f3f2ef14;margin:22px 0}.actions{display:flex;gap:12px;margin-top:24px}.footer{position:absolute;bottom:27px;left:44px;right:44px;display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--soft)}.footer .keys{display:flex;gap:28px}.key{color:var(--ink);margin-right:8px}.warning-line{display:flex;align-items:center;gap:13px;color:var(--warn);font-size:19px;margin:20px 0}.warning-line .icon{width:24px;height:24px}.bar{display:flex;height:20px;border-radius:12px;overflow:hidden;background:#f3f2ef12;margin:24px 0 18px}.bar span{display:block;min-width:1px}.fetch{background:#b7c9d0}.wrap{background:#c8bda9}.other{background:#6d747a}.legend{display:flex;gap:28px;flex-wrap:wrap;font-size:19px;color:var(--muted);line-height:1.6}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:9px}.number{font-size:32px;letter-spacing:-.02em;font-weight:700}.subheader{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.subheader p{font-size:19px;color:var(--muted)}.addon-head,.addon-row{display:grid;grid-template-columns:430px 220px 170px 170px 1fr;gap:28px;align-items:center}.addon-head{font-size:16px;color:var(--soft);padding:0 22px 18px}.addon-row{height:98px;padding:16px 22px;border-radius:22px;background:transparent;width:100%;text-align:left}.addon-row:focus{background:var(--focus)}.addon-row p{font-size:19px;color:var(--muted);margin-top:5px}.addon-row .number{font-size:27px}.trend{display:flex;align-items:center;gap:12px;font-size:19px;color:var(--muted)}.trend svg{width:72px;height:34px;overflow:visible}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 28px;margin:26px 0}.metric{padding:10px 0}.metric .number{font-size:27px;display:block;margin-top:10px}.service{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:24px 0}.service strong{font-size:28px}.service p{font-size:19px;color:var(--muted);margin:8px 0}.removal{display:flex;justify-content:space-between;font-size:23px;padding:14px 0}.notice{min-height:170px;display:flex;align-items:center;gap:22px;padding:28px 0}.notice .icon{height:46px;width:46px}.notice h2{font-size:32px}.notice p{max-width:65ch;font-size:23px;color:var(--muted)}.previous{opacity:.55}.skeleton{height:24px;width:330px;background:#f3f2ef14;border-radius:8px;margin-top:14px}.sources-layout{display:grid;grid-template-columns:560px 1fr;gap:64px}.title-art{height:290px;display:flex;flex-direction:column;justify-content:flex-end;padding:34px;background:#22252a;border-radius:22px}.title-art h2{font-size:42px;letter-spacing:.03em}.title-art p{font-size:19px;color:var(--muted)}.source-row{min-height:104px}.source-row .number{font-size:25px}.overlay{position:absolute;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;z-index:3}.detail{width:880px;max-height:850px;padding:44px;border-radius:34px;background:#121316;box-shadow:0 12px 32px #0006}.detail h2{font-size:36px;margin:14px 0 24px}.detail p{font-size:23px;color:var(--muted);margin:14px 0}.empty-count{margin-top:30px;font-size:19px;color:var(--muted)}body[data-screen="configuration"] .row{min-height:82px;padding-top:12px;padding-bottom:12px}body[data-state="degraded"] .warning-line,body[data-state="offline"] .warning-line,body[data-state="failing"] .warning-line,body[data-state="loading"] .warning-line{margin:0 0 14px}body:not([data-state="healthy"]) .subheader{margin-bottom:12px}body:not([data-state="healthy"]) .addon-row{height:88px}body:not([data-state="healthy"]) .metrics{margin:12px 0}body:not([data-state="healthy"]) .divider{margin:14px 0}body[data-screen="pipeline"] .metrics{margin:14px 0;gap:8px 20px}body[data-screen="pipeline"] .metric{padding:5px 0}body[data-screen="pipeline"] .divider{margin:14px 0}body[data-screen="pipeline"] .removal{font-size:22px;padding:6px 0}body[data-screen="pipeline"] .service-row{min-height:108px!important;padding:12px 22px}body[data-screen="pipeline"] .note{font-size:19px}body[data-screen="pipeline"] .section-title{padding-bottom:12px}body[data-screen="pipeline"] h2{font-size:28px}
</style>
</head>
<body>
<div class="clock" id="clock"></div><div class="brand">NUVIO</div>
<main class="sheet"><header><div><div class="kicker" id="context"></div><h1 id="title"></h1></div><div class="header-right"><span class="tiny" id="provenance"></span><button class="chip" id="refresh" data-action="refresh"></button></div></header><nav class="segments" id="navigation" aria-label="Dashboard sections"></nav><div class="content" id="content"></div><footer class="footer"><div class="keys" id="keys"></div><span id="footnote"></span></footer></main>
<div id="dialog"></div>
<script src="data.js"></script>
<script>
// Static approval preview. No service requests, credentials, persistence or production integration.
const D=window.AIO_RESEARCH, sample=D.requests.series;
const strings={
 overview:'Overview',addons:'Add-ons',pipeline:'Pipeline',configuration:'Configuration',sources:'Sources',
 loading:'Checking sources',healthy:'Streams available',degraded:'Some add-ons need attention',failing:'AIOStreams returned an error',offline:'Cannot reach AIOStreams',
 check:'Check now',preview:'Observation · redacted',scenario:'Scenario · synthetic state',previous:'Previous observation',
 heading:'AIOStreams',context:'Add-ons / AIOStreams · Stable 2.37.0',sourceContext:'Redacted episode / Sources',
 clock:'Latest check complete',oldClock:'Previous check shown',checking:'Checking AIOStreams',details:'Details',back:'Back',returnSources:'Back to Sources',
 phone:'Configure on phone',waiting:'Waiting for diagnostics',response:'Responding',available:'20 streams available',
 observed:'4 observed replies succeeded',cache:'Debrid cache',wrapper:'of wrapper inputs',catalogs:'248 catalogs enabled',
 omitted:'128 shown here · 120 omitted from inventory',latest:'Latest episode',reported:'Reported by AIOStreams',
 observations:'2 observations · local limit 10',host:'Host',sourceReplies:'Add-on replies',noErrors:'No source errors reported',
 pipelineTotal:'Server pipeline',fetch:'Fetch',wrap:'Service wrap',other:'Other serial work',overlap:'Nested phases overlap; not an additive waterfall.',
 client:'Client request',removals:'Why streams were removed',size:'Size limit',visual:'Excluded visual tag (3D)',keywords:'Excluded keywords',
 cacheNote:'Wrapper input checks only. Direct debrid results excluded.',uncached:'uncached',unknown:'unclassified',magnet:'Magnet check',
 raw:'Raw entries',current:'Current time',status:'Status',trend:'Previous / current',source:'Add-on / service',responded:'Responded',
 healthTitle:'No host outage observed',healthBody:'Health checks the database path. This does not measure video throughput or first frame.',
 lowTitle:'Low cache coverage',lowBody:'Few wrapper inputs were cached. Available streams remain usable; this does not prove an account failure.',
 configTitle:'Owner configure export',configBody:'Manual snapshot. Installation API configuration access is still restricted.',
 phoneTitle:'Continue on your phone',phoneBody:'Approval preview only. Production uses the existing protected handoff. No settings have been changed.',
 refreshTitle:'Static approval preview',refreshBody:'These are recorded measurements. Check now will make one scoped request in the application; this preview makes none.',
 errorTitle:'Synthetic source timeout',errorBody:'Debridio Scraper / RD exceeded its 7 s timeout in this scenario. Other sources still provide 20 playable candidates. No timeout was observed in the real samples.',
 failingBody:'Server replied with unusable data in this scenario. Last valid measurements remain below.',offlineBody:'No connection in this scenario. Measurements below are from the previous check.',
 degradedBody:'20 streams remain available · one named source timeout (scenario)',loadingBody:'Previous observation stays visible while a new check runs.',
 tryAgain:'Try again',inspect:'Inspect source issue',observedOnly:'Only sources reported for this request are assessed.',
 configTimeout:'Source timeouts',timeoutValue:'Torrentio / Comet 30 s · Debridio 7 s',configFetch:'Fetching and groups',fetchValue:'Dynamic fetching off · groups off',
 configPlayback:'Playback and formatter',playbackValue:'Preload + precache on · bingeGroup autoplay · tamtaro',configDiagnostics:'Diagnostics and access',diagnosticsValue:'Statistic Streams on · Hide Errors off · API config restricted',
 suggestionTitle:'Owner-side suggestions only',suggestionBody:'Trial shorter stream timeouts or early-exit fetching on your phone. Late results may be lost. Catalog selection targets Home load, not proven scrape delay.',
 configNote:'Catalog inventory is truncated; playback capability is independent.',
 sourceNote:'Redacted source labels illustrate layout. Availability count is measured.',sourceChip:'20 available · 4 add-ons responded',sourceIssue:'20 available · 1 source issue',
 pick:'Select source',sourcePreview:'Source selection preview',sourcePreviewBody:'No stream URL is present in this mockup. Production selection preserves service cache metadata, required headers and bingeGroup.',
 removalNote:'Upstream removal events, not a unique rejected-stream total.',pipelineNote:'Media info, Filter and Precompute include nested work.',
 timeCaption:'~1.21 s server · 2.01 s client',phaseDetails:'Phase and cache details',noPlay:'No playable candidates in this scenario',
 history:'Previous and current observations only; no ten-sample trend claimed.',ok:'OK',escape:'BACK',arrows:'Arrows',navigate:'Navigate',
 sourceDetails:'Source diagnostics',close:'Return',condition:'Data unavailable for current request',sourceFooter:'20 playable candidates · 11 statistic entries hidden',sourceRow:'Recorded candidate · details redacted',sourceOffline:'Previous sources · connection unavailable',sourceFailing:'Inspect response error',
 statFooter:'Statistic entries excluded from playback and autoplay',loadingFooter:'Loading · previous data',solid:'Solid material',glass:'Glass material',
};
const t=k=>{if(!(k in strings))throw Error('Missing preview string: '+k);return strings[k]};
const query=new URLSearchParams(location.search),screens=['overview','addons','pipeline','configuration','sources'],states=['loading','healthy','degraded','failing','offline'];
let screen=screens.includes(query.get('screen'))?query.get('screen'):'overview',state=states.includes(query.get('state'))?query.get('state'):'healthy';
let origin=screen,restore=null;
if(query.get('material')==='solid')document.body.classList.add('solid');
const icon=n=>`<img class="icon" alt="" src="../../../../deploy/app/art/icones/lucide/${n}.svg">`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>new Intl.NumberFormat('en').format(n),ms=n=>n>=1000?`${(n/1000).toFixed(2)} s`:`${num(n)} ms`,pct=s=>(100*s.cached/s.torrents).toFixed(1)+'%';
const act=(key,action='detail',detail=key)=>`<button class="chip" data-action="${action}" data-detail="${detail}">${t(key)}</button>`;
const row=(ico,title,subtitle,right,action,detail)=>`<button class="row" data-action="${action}" data-detail="${detail||''}"><div class="left">${icon(ico)}<div><h3>${title}</h3><p>${subtitle}</p></div></div><div class="right"><span>${right||''}</span>${icon('chevron-right')}</div></button>`;
function bar(){const p=sample.phases,total=p.Total,residual=total-p.Fetch-p['Service Wrap'];return `<div class="bar" aria-label="${t('pipelineTotal')}: ${ms(total)}"><span class="fetch" style="width:${p.Fetch/total*100}%"></span><span class="wrap" style="width:${p['Service Wrap']/total*100}%"></span><span class="other" style="width:${residual/total*100}%"></span></div><div class="legend"><span><i class="fetch"></i>${t('fetch')} ${ms(p.Fetch)}</span><span><i class="wrap"></i>${t('wrap')} ${ms(p['Service Wrap'])}</span><span><i class="other"></i>${t('other')} ~${ms(residual)}</span></div>`}
function stateBanner(){if(state==='healthy'||screen==='overview')return '';const symbols={loading:'activity',degraded:'triangle-alert',failing:'x',offline:'wifi-off'};return `<div class="warning-line">${icon(symbols[state])}<span>${t(state)} · ${state==='degraded'?t('errorTitle'):t('previous')}</span></div>`}
function overview(){const symbols={healthy:'circle-check',loading:'activity',degraded:'triangle-alert',failing:'x',offline:'wifi-off'};const support={healthy:`${t('available')} · ${t('latest').toLowerCase()} ${ms(sample.clientMs)}`,loading:t('loadingBody'),degraded:t('degradedBody'),failing:t('failingBody'),offline:t('offlineBody')};return `<div class="verdict ${state==='healthy'?'ok':state==='degraded'?'warn':''}">${icon(symbols[state])}<div><h2>${t(state)}</h2><p>${support[state]}</p></div></div><div class="columns ${['offline','failing','loading'].includes(state)?'previous':''}"><section>${row('server',t('host'),t('response'),ms(D.healthMs),'detail','health')}${row('puzzle',t('sourceReplies'),state==='degraded'?t('errorTitle'):t('observed'),state==='degraded'?'1 / 4':t('noErrors'),state==='degraded'?'detail':'screen',state==='degraded'?'error':'addons')}${row('cloud',t('cache'),`AD ${pct(sample.services[0])} · RD ${pct(sample.services[1])}`,t('wrapper'),'detail','cache')}</section><section><div class="section-title"><h3>${t('pipelineTotal')}</h3><span>~${ms(sample.phases.Total)}</span></div>${bar()}<p class="note" style="margin-top:18px">${t('overlap')}</p><div class="divider"></div><button class="row" style="min-height:90px;padding:8px 0" data-action="screen" data-detail="configuration"><div><h3 class="warn">${t('catalogs')}</h3><p>${t('omitted')}</p></div>${icon('chevron-right')}</button></section></div><div class="actions">${act(state==='healthy'?'returnSources':state==='degraded'?'inspect':'tryAgain',state==='healthy'?'screen':'detail',state==='healthy'?'sources':state==='degraded'?'error':'refresh')}${act('phone','detail','phone')}</div>`}
function addons(){const prev=new Map(sample.previous.addons.map(a=>[a.name,a]));const order=['Debridio Scraper RD','Debridio Scraper AD','Torrentio p2p','Comet p2p'];return `${stateBanner()}<div class="subheader"><div><h2>${t('latest')}</h2><p>${t('reported')} · ${t('observations')}</p></div><p>${t('observedOnly')}</p></div><div class="addon-head"><span>${t('source')}</span><span>${t('status')}</span><span>${t('current')}</span><span>${t('raw')}</span><span>${t('trend')}</span></div><div class="${['offline','failing','loading'].includes(state)?'previous':''}">${order.map(name=>{const a=sample.addons.find(a=>a.name===name),p=prev.get(name),bad=state==='degraded'&&name.endsWith('RD');const y=p.ms>a.ms?'7,5 64,29':'7,29 64,5';return `<button class="addon-row" data-action="detail" data-detail="${bad?'error':esc(name)}"><div><h3>${esc(name.replace(/ (RD|AD|p2p)$/,''))}</h3><p>${esc(name.split(' ').at(-1))}</p></div><span class="${bad?'warn':'ok'}">${bad?'Timeout (scenario)':t('responded')}</span><span class="number mono">${bad?'7.00 s':ms(a.ms)}</span><span class="number mono">${bad?'—':num(a.streams)}</span><div class="trend"><svg viewBox="0 0 72 34" aria-hidden="true"><polyline points="${y}" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="64" cy="${p.ms>a.ms?29:5}" r="3" fill="currentColor"/></svg><span>${ms(p.ms)} / ${bad?'—':ms(a.ms)}</span></div></button>`}).join('')}</div><p class="note" style="margin:22px 22px 0">${t('history')}</p>`}
function pipeline(){return `${stateBanner()}<div class="columns ${['offline','failing','loading'].includes(state)?'previous':''}"><section><div class="section-title"><h2>${t('pipelineTotal')}</h2><span>${t('timeCaption')}</span></div>${bar()}<div class="metrics">${[['Media Info','Media info'],['Filter','Filter'],['Dedup','Dedup'],['Sort','Sort']].map(([k,label])=>`<div class="metric"><span class="label">${label}</span><span class="number mono">${ms(sample.phases[k])}</span></div>`).join('')}</div><p class="note">${t('pipelineNote')}</p><p class="note" style="margin-top:14px">Precompute 3 ms · Limit 0 ms · SEL 0 ms</p><div class="divider"></div>${act('phaseDetails','detail','phases')}</section><section><div class="section-title"><h2>${t('cache')}</h2><span>${t('lowTitle')}</span></div>${sample.services.map(s=>`<button class="row service-row" style="display:block;min-height:156px" data-action="detail" data-detail="cache"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${s.name}</h3><strong class="number mono">${pct(s)}</strong></div><p>${s.cached} / ${s.torrents} cached · ${s.uncached} ${t('uncached')} · ${s.unclassified} ${t('unknown')}</p><p>${t('magnet')}: ${ms(s.magnetMs)}</p></button>`).join('')}<p class="note" style="margin:10px 22px">${t('cacheNote')}</p><div class="divider"></div><h3>${t('removals')}</h3>${sample.removals.map(r=>`<div class="removal"><span>${t({'Size':'size','Excluded Visual Tag':'visual','Excluded Keywords':'keywords'}[r.reason])}</span><strong>${num(r.count)}</strong></div>`).join('')}<p class="note">${t('removalNote')}</p></section></div>`}
function configuration(){const rows=[['cloud','catalogs','omitted','catalog'],['timer','configTimeout','timeoutValue','suggestion'],['puzzle','configFetch','fetchValue','suggestion'],['sliders-horizontal','configPlayback','playbackValue','config'],['activity','configDiagnostics','diagnosticsValue','config']];return `${stateBanner()}<div class="subheader"><div><h2>${t('configTitle')}</h2><p>${t('configBody')}</p></div><span class="label">${t('previous')}</span></div>${rows.map(([ico,title,sub,detail])=>row(ico,t(title),t(sub),'','detail',detail)).join('')}<p class="note" style="margin:14px 22px">${t('configNote')}</p>`}
function sources(){return `${stateBanner()}<div class="sources-layout"><section><div class="title-art"><span class="kicker">REDACTED TITLE</span><h2>Episode</h2><p>Season 1 · Episode 1</p></div><p class="note" style="margin-top:24px">${t('sourceNote')}</p><div style="margin-top:24px">${act(({loading:'loading',degraded:'sourceIssue',failing:'sourceFailing',offline:'sourceOffline'})[state]||'sourceChip','screen','overview')}</div></section><section class="${['offline','loading'].includes(state)?'previous':''}"><div class="section-title"><h2>${state==='failing'?t('noPlay'):t('available')}</h2><span>${t('latest')} ${ms(sample.clientMs)}</span></div>${state==='failing'?`<div class="notice">${icon('x')}<p>${t('failingBody')}</p></div>${act('sourceDetails','screen','overview')}`:[1,2,3,4].map((n)=>row('cloud',`Redacted source ${n}`,t('sourceRow'),`#${n}`,'detail','source')).join('')}<p class="note" style="margin:22px">${t('statFooter')}</p></section></div>`}
function render(){document.body.dataset.screen=screen;document.body.dataset.state=state;document.getElementById('context').textContent=t(screen==='sources'?'sourceContext':'context');document.getElementById('title').textContent=screen==='overview'?t('heading'):t(screen);document.getElementById('clock').innerHTML=icon(state==='loading'?'activity':'clock')+t(state==='loading'?'checking':['failing','offline'].includes(state)?'oldClock':'clock');document.getElementById('provenance').textContent=(state==='healthy'?t('preview'):t('scenario'))+' · '+D.capturedAt.slice(11,16)+' UTC';const refresh=document.getElementById('refresh');refresh.innerHTML=icon('refresh-cw')+t('check');refresh.disabled=state==='loading';document.getElementById('navigation').innerHTML=screens.filter(s=>s!=='sources').map(s=>`<button class="segment ${s===screen?'selected':''}" data-action="screen" data-detail="${s}" aria-current="${s===screen?'page':'false'}">${t(s)}</button>`).join('');document.getElementById('content').innerHTML=({overview,addons,pipeline,configuration,sources}[screen])();document.getElementById('keys').innerHTML=`<span><span class="key">${t('ok')}</span>${t(screen==='sources'?'pick':'details')}</span><span><span class="key">${t('escape')}</span>${t('back')}</span><span><span class="key">${t('arrows')}</span>${t('navigate')}</span>`;document.getElementById('footnote').textContent=state==='loading'?t('loadingFooter'):screen==='sources'?(['failing','offline'].includes(state)?t('previous')+' · ':'')+t('sourceFooter'):t('reported')+' · '+t(document.body.classList.contains('solid')?'solid':'glass');focusFirst()}
function focusFirst(){(document.querySelector('#content button')||document.querySelector('nav button'))?.focus()}
function modal(detail){restore=document.activeElement;let title,body;if(detail==='health'){title=t('healthTitle');body=t('healthBody')}else if(detail==='cache'){title=t('lowTitle');body=t('lowBody')+' '+t('cacheNote')}else if(detail==='config'){title=t('configTitle');body=t('configBody')}else if(detail==='catalog'){title=t('catalogs');body=t('omitted')+'. '+t('suggestionBody')}else if(detail==='suggestion'){title=t('suggestionTitle');body=t('suggestionBody')}else if(detail==='phone'){title=t('phoneTitle');body=t('phoneBody')}else if(detail==='error'){title=t('errorTitle');body=t('errorBody')}else if(detail==='source'){title=t('sourcePreview');body=t('sourcePreviewBody')}else if(detail==='phases'){title=t('phaseDetails');body=t('overlap')+' '+t('pipelineNote')}else {const a=sample.addons.find(a=>a.name===detail);title=a?a.name:t('refreshTitle');body=a?`${t('responded')}: ${ms(a.ms)} · ${num(a.streams)} ${t('raw').toLowerCase()}. ${t('reported')}. ${t('observations')}.`:t('refreshBody')}document.getElementById('dialog').innerHTML=`<div class="overlay"><section class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="kicker">${t('details')}</div><h2 id="detail-title">${esc(title)}</h2><p>${esc(body)}</p><div class="actions">${act('close','close')}</div></section></div>`;document.querySelector('.detail button').focus()}
function close(){document.getElementById('dialog').innerHTML='';restore?.focus()}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='screen'){origin=screen;screen=b.dataset.detail;render()}else if(a==='close')close();else modal(a==='refresh'?'refresh':b.dataset.detail)});
document.addEventListener('keydown',event=>{if(event.key==='Escape'||event.key==='Backspace'){event.preventDefault();if(document.querySelector('.overlay'))close();else if(screen!==origin){screen=origin;render()}return}if(!event.key.startsWith('Arrow'))return;event.preventDefault();if(document.querySelector('.overlay'))return;const nav=[...document.querySelectorAll('nav button')],rows=[...document.querySelectorAll('#content button:not(:disabled)')],current=document.activeElement;let next;if(nav.includes(current)){const i=nav.indexOf(current);if(event.key==='ArrowDown')next=rows[0];if(event.key==='ArrowLeft')next=nav[Math.max(0,i-1)];if(event.key==='ArrowRight')next=nav[Math.min(nav.length-1,i+1)]}else{const all=[...rows,document.getElementById('refresh')].filter(b=>!b.disabled),i=all.indexOf(current);if(event.key==='ArrowUp')next=i<=0?nav.find(b=>b.dataset.detail===screen)||nav[0]:all[i-1];else next=all[Math.min(all.length-1,i+1)]}next?.focus()});
render();window.preview={get screen(){return screen},get state(){return state},strings};
</script>
</body>
</html>
